name: Sync SanMar catalog nightly

on:
  # Run every day at 08:00 UTC (≈ 1am PST / 4am EST — after SanMar's 6am PST file update).
  # Adjust as needed. cron is UTC.
  schedule:
    - cron: '0 14 * * *'  # 14:00 UTC = 6am PST, giving SanMar's 6am PST feed time to complete
  # Allow manual runs from the Actions tab
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit to first N styles (blank = all)'
        required: false
        default: ''

# This workflow writes to the repo and publishes to Pages.
permissions:
  contents: write   # needed to commit products.json
  pages: write      # needed to deploy to GitHub Pages
  id-token: write   # needed for the Pages deploy action

# Only one sync can run at a time
concurrency:
  group: sanmar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SanMar sync
        env:
          SANMAR_FTP_USER: ${{ secrets.SANMAR_FTP_USER }}
          SANMAR_FTP_PASSWORD: ${{ secrets.SANMAR_FTP_PASSWORD }}
        run: |
          LIMIT_ARG=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            LIMIT_ARG="--limit ${{ github.event.inputs.limit }}"
          fi
          python sync-sanmar.py $LIMIT_ARG

      - name: Show summary
        run: |
          echo "products.json size: $(wc -c < products.json) bytes"
          echo "product count: $(python -c 'import json; print(json.load(open("products.json"))["product_count"])')"
          echo "generated at: $(python -c 'import json; print(json.load(open("products.json"))["generated_at"])')"

      # products.json is a fully regenerated artifact, not hand-edited source. Rebasing it onto
      # a moved main is guaranteed to conflict (the whole file differs), which is what broke
      # run #220: `git pull --rebase` conflicted, `|| true` swallowed the error, and the push
      # then failed from a detached HEAD with exit 128 — skipping the Pages steps entirely.
      # Instead: rewind the branch pointer onto the latest origin/main while KEEPING the file
      # we just generated, then commit and push. Newest sync always wins. No merge, ever.
      - name: Commit products.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main

            # Point HEAD *and the index* at the newest origin/main, leaving the working tree
            # alone. --mixed (not --soft) is load-bearing: with --soft the index would still
            # hold our stale checkout, and committing it would silently DELETE any file a
            # human pushed while the sync was running. With --mixed the commit is exactly
            # "origin/main, plus the products.json we just generated".
            git checkout -B main
            git reset origin/main

            git add products.json
            if git diff --staged --quiet; then
              echo "No changes to products.json — skipping commit"
              git checkout -- .
              exit 0
            fi

            git commit -m "chore: nightly SanMar sync $(date -u +%Y-%m-%d)"

            if git push origin main; then
              # Re-sync the working tree to what we just pushed, so the Pages staging step
              # below publishes the current files and not our pre-fetch copies.
              git checkout -- .
              echo "Pushed products.json (attempt $attempt)"
              exit 0
            fi

            echo "Push rejected — origin/main moved underneath us. Retrying ($attempt/3)."
            sleep 5
          done

          echo "::error::Could not push products.json after 3 attempts"
          exit 1

      # Prepare the folder to publish. A missing OPTIONAL file now warns instead of aborting:
      # previously a single bad filename here killed the publish for every other file too.
      - name: Stage Pages artifact
        run: |
          mkdir -p _site

          REQUIRED="products.json index.html"
          OPTIONAL="alive-pricing-calculator.html alive-pricing-calculator-v2.html cart.html mockup.html design-studio.html project.html deals-config.js deal.html"

          for f in $REQUIRED; do
            if [ ! -f "$f" ]; then
              echo "::error::Required file $f is missing — refusing to publish an incomplete site"
              exit 1
            fi
            cp "$f" "_site/$f"
          done

          for f in $OPTIONAL; do
            if [ -f "$f" ]; then
              cp "$f" "_site/$f"
            else
              echo "::warning::$f not found — skipping it; the rest of the site still publishes"
            fi
          done

          echo "Staged for Pages: $(ls _site | tr '\n' ' ')"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
