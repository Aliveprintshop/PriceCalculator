/* =====================================================================
   ALIVE PRINT SHOP — STEP 2 OF 4, COLOUR THEN SIZES
   Generated by build_step2.py. Edit that, not this file.
   Scoped to #alive-flow — see claude/tech-notes-css-scoping.md.
   ===================================================================== */
:root,#alive-flow{
  --bg:#f2f4f7;--surface:#fff;--surface2:#f7f8fa;
  --border:#e2e6eb;--border2:#c8cdd5;
  --text:#0f1117;--text2:#4b5563;--text3:#9ca3af;
  --blue:#1b6cce;--blue-light:#eef4fc;--blue-mid:#a8c8f0;--blue-dark:#1558a8;
  --green:#16a34a;--green-light:#f0fdf4;
  --amber:#b45309;--amber-light:#fffbeb;
  --ink:#0f1117;--r:8px;--r-lg:14px;--r-xl:20px;
  --disp:'Montserrat',sans-serif;--body:'Open Sans',sans-serif;
}
#alive-flow,#alive-flow *{box-sizing:border-box;margin:0;padding:0;}
#alive-flow{font-family:var(--body);background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;display:block;}
#alive-flow img{max-width:100%;display:block;}
#alive-flow button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
#alive-flow a{color:var(--blue);}
#alive-flow h1,#alive-flow h2,#alive-flow h3,#alive-flow h4{font-family:var(--disp);line-height:1.14;letter-spacing:-.01em;}
#alive-flow :focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:4px;}
#alive-flow .num{font-variant-numeric:tabular-nums;}
#alive-flow .wrap{max-width:1120px;margin:0 auto;padding-inline:18px;}
#alive-flow .narrow{max-width:860px;margin:0 auto;}
#alive-flow .cta{display:block;width:100%;background:var(--blue);color:#fff;border-radius:var(--r-lg);
  padding:16px 20px;font-family:var(--disp);font-size:15px;font-weight:800;letter-spacing:.04em;
  text-transform:uppercase;text-align:center;text-decoration:none;}
#alive-flow .cta:hover{background:var(--blue-dark);}
#alive-flow .cta:disabled{background:var(--border2);cursor:not-allowed;}
/* ---- 4-step progress bar (shared by all four steps) ----------------- */
#alive-flow .steps{background:var(--surface);border-bottom:1px solid var(--border);}
#alive-flow .steps-in{max-width:720px;margin:0 auto;padding:18px 16px 16px;
  display:flex;align-items:flex-start;justify-content:center;}
#alive-flow .stp{display:flex;flex-direction:column;align-items:center;gap:7px;
  flex:0 0 auto;width:92px;text-decoration:none;background:none;border:0;padding:0;}
#alive-flow .stp .dot{width:30px;height:30px;border-radius:50%;background:var(--border2);color:#fff;
  display:grid;place-items:center;font-family:var(--disp);font-size:13px;font-weight:800;
  transition:background .15s,box-shadow .15s;}
#alive-flow .stp .nm{font-family:var(--disp);font-size:11.5px;font-weight:700;color:var(--text3);
  text-align:center;line-height:1.25;}
#alive-flow .stp.done .dot{background:var(--ink);}
#alive-flow .stp.done .nm{color:var(--text2);}
#alive-flow .stp.done{cursor:pointer;}
#alive-flow .stp.done:hover .dot{background:var(--blue-dark);}
#alive-flow .stp.done:hover .nm{color:var(--blue);}
#alive-flow .stp.now .dot{background:var(--blue);box-shadow:0 0 0 4px var(--blue-light);}
#alive-flow .stp.now .nm{color:var(--blue);}
#alive-flow .stp .dot svg{width:15px;height:15px;}
#alive-flow .rule{flex:1 1 auto;height:2px;background:var(--border);margin-top:14px;
  max-width:74px;min-width:8px;border-radius:2px;}
#alive-flow .rule.done{background:var(--ink);}
/* Four steps do not fit a small phone at full width. */
@media(max-width:440px){
  #alive-flow .stp{width:auto;flex:1 1 0;min-width:0;}
  #alive-flow .stp .nm{font-size:10px;}
  #alive-flow .steps-in{padding:14px 10px 12px;}
}
/* ---- step shell: control panel + product card + media strip --------- */
/* minmax(0,1fr), not the default auto — an auto track lets the media strip
   push the page wider than the viewport on a phone. */
#alive-flow .shell{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding-block:22px 6px;}
#alive-flow .shell > *{min-width:0;}
@media(min-width:900px){#alive-flow .shell{grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:22px;align-items:start;}}

/* left control panel */
#alive-flow .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:16px;display:grid;gap:16px;align-content:start;}
@media(min-width:900px){#alive-flow .panel{position:sticky;top:14px;}}
#alive-flow .panel .cap{font-family:var(--disp);font-size:11px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--text2);margin-bottom:9px;}

/* price tiles */
#alive-flow .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
#alive-flow .tile{border-radius:var(--r-lg);padding:11px 13px;border:1.5px solid transparent;}
#alive-flow .tile .k{font-family:var(--disp);font-size:9px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;opacity:.75;}
#alive-flow .tile .v{font-family:var(--disp);font-size:23px;font-weight:800;letter-spacing:-.025em;margin-top:3px;}
#alive-flow .tile.unit{background:var(--blue-light);border-color:var(--blue-mid);color:var(--blue-dark);}
#alive-flow .tile.total{background:var(--green-light);border-color:#bbf7d0;color:#15803d;}

/* quantity stepper */
#alive-flow .qty{display:flex;align-items:center;justify-content:space-between;gap:12px;}
#alive-flow .qty > span{display:flex;align-items:center;font-family:var(--disp);font-size:16px;font-weight:800;text-transform:uppercase;}
#alive-flow .qtybox{display:flex;align-items:center;gap:2px;background:var(--surface2);
  border:1.5px solid var(--border);border-radius:999px;padding:3px;}
#alive-flow .qtybox button{width:32px;height:32px;border-radius:50%;font-size:19px;font-weight:700;
  color:var(--text2);display:grid;place-items:center;line-height:1;}
#alive-flow .qtybox button:hover:not(:disabled){background:#fff;color:var(--blue);}
#alive-flow .qtybox button:disabled{opacity:.35;cursor:not-allowed;}
#alive-flow .qtybox input{width:54px;border:0;background:none;text-align:center;font:inherit;
  font-family:var(--disp);font-size:16px;font-weight:800;color:var(--text);
  font-variant-numeric:tabular-nums;-moz-appearance:textfield;}
#alive-flow .qtybox input::-webkit-outer-spin-button,
#alive-flow .qtybox input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
#alive-flow .qtynote{font-size:12px;color:var(--text3);line-height:1.5;}
#alive-flow .qtynote.warn{color:var(--amber);}

/* product card on the right */
#alive-flow .pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:16px 16px 14px;position:relative;}
#alive-flow .pcard .brand{font-family:var(--disp);font-size:10.5px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--blue);}
#alive-flow .pcard h2{font-size:17px;font-weight:800;margin-top:3px;}
#alive-flow .pcard .style{font-size:12.5px;color:var(--text3);margin-top:2px;}
/* The stage takes the PRODUCT's aspect, not a fixed 4:5, and the photo box
   fills it exactly. Two bugs came from the old version:
     - a 1:1 cap photo in a 4:5 stage was 540 wide inside a 432-wide box, so
       overflow:hidden clipped the bill on both sides;
     - max-height derived a width narrower than the card, and without
       margin-inline:auto the whole thing sat left of centre on desktop.
   productCard() writes the aspect from the profile's `frame`. */
#alive-flow .stage{margin:12px auto 0;position:relative;aspect-ratio:2/3;max-height:540px;
  background:#fff;border-radius:var(--r);overflow:hidden;}
/* The art box tracks the PHOTO, not the card, so overlays land in photo
   coordinates. SanMar flat lays are all 1200x1800 (2:3); a manually added
   supplier photo can be any shape, so each profile states its own `frame`
   and productCard() writes it here. Get this wrong and placed artwork sits
   in the letterbox instead of on the garment. */
#alive-flow .stage-art{position:absolute;inset:0;}
#alive-flow .stage-art > img{width:100%;height:100%;object-fit:contain;display:block;}
/* A SanMar cap flat is the same 1200x1800 frame as a shirt, but the cap only
   fills the top third of it, so an untouched flat renders as a small object
   floating in white. .zoomed scales the photo about its own upper area on the
   steps that only DISPLAY it. Step 3 never sets this: the placement editor's
   coordinates are fractions of the untouched frame. */
/* The cap occupies y 0.02-0.42 of its flat, centred at 0.22. To land that
   centre at 0.5 of the box at scale s, the origin is o where
   0.5 = o + (0.22 - o)s  ->  o = -0.13 at s = 1.8. */
#alive-flow .stage-art.zoomed > img{transform:scale(1.8);transform-origin:50% -13%;}
#alive-flow .sides{display:flex;gap:0;justify-content:center;margin-top:10px;}
#alive-flow .sides button{font-family:var(--disp);font-size:11px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text2);background:var(--surface2);border:1.5px solid var(--border);
  padding:7px 20px;}
#alive-flow .sides button:first-child{border-radius:var(--r) 0 0 var(--r);}
#alive-flow .sides button:last-child{border-radius:0 var(--r) var(--r) 0;border-left:0;}
#alive-flow .sides button.on{background:var(--blue);border-color:var(--blue);color:#fff;}

/* a block joined to the bottom of the product card (color grid, size grid) */
#alive-flow .pcard-foot{border-top:1px solid var(--border);margin:14px -16px 0;padding:16px 16px 2px;}
#alive-flow .pcard-foot .fhead{display:flex;justify-content:space-between;align-items:baseline;
  gap:12px;margin-bottom:11px;}
#alive-flow .pcard-foot .fhead .lbl{font-family:var(--disp);font-size:11.5px;font-weight:800;
  letter-spacing:.09em;text-transform:uppercase;color:var(--text2);}
#alive-flow .pcard-foot .fhead .lbl b{color:var(--text);}
#alive-flow .pcard-foot .fhead .aux{font-family:var(--disp);font-size:11px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:var(--text3);}

/* media strip */
/* No visible scrollbar: the tiles are draggable, which is what a phone does
   natively and what pointer events below give a mouse. */
#alive-flow .strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(128px,1fr);gap:10px;
  overflow-x:auto;padding:16px 0 4px;scrollbar-width:none;-ms-overflow-style:none;
  scroll-snap-type:x proximity;cursor:grab;}
#alive-flow .strip::-webkit-scrollbar{display:none;}
#alive-flow .strip.dragging{cursor:grabbing;scroll-snap-type:none;}
/* Without this the browser starts its own image-drag as soon as the pointer
   moves, which cancels the pointermove stream and the strip never scrolls. */
#alive-flow .strip img{-webkit-user-drag:none;user-drag:none;user-select:none;}
#alive-flow .strip > *{scroll-snap-align:start;}
#alive-flow .strip figure{aspect-ratio:1/1;border-radius:var(--r-lg);overflow:hidden;position:relative;
  background:var(--surface2);border:1px solid var(--border);}
#alive-flow .strip img{width:100%;height:100%;object-fit:cover;}
#alive-flow .gtile{display:block;width:100%;padding:0;background:none;border:0;}
#alive-flow .gtile figure{transition:border-color .12s ease;}
#alive-flow .gtile:hover figure{border-color:var(--blue-mid);}
#alive-flow .gtile.on figure{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-light);}
/* A video plays in the same frame the photo used, so the card never jumps. */
#alive-flow .stage-art > video{width:100%;height:100%;object-fit:contain;display:block;background:#000;}
#alive-flow .strip .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  color:var(--text3);font-size:11px;padding:10px;}
#alive-flow .strip .ph svg{width:22px;height:22px;margin:0 auto 6px;display:block;opacity:.5;}
#alive-flow .strip .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;
  box-shadow:0 2px 10px rgba(0,0,0,.2);}
#alive-flow .strip .play svg{width:16px;height:16px;color:var(--ink);margin-left:2px;}
#alive-flow .strip .dur{position:absolute;right:7px;bottom:7px;background:rgba(15,17,23,.78);color:#fff;
  font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;}
/* ---- help + price-break nudge (every step) --------------------------- */
#alive-flow .help{border-top:1px solid var(--border);padding-top:14px;display:grid;gap:7px;}
#alive-flow .help .cap{margin-bottom:0;}
#alive-flow .help a{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text2);
  text-decoration:none;padding:7px 9px;border-radius:var(--r);border:1px solid var(--border);
  background:var(--surface2);}
#alive-flow .help a:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-light);}
#alive-flow .help a svg{width:16px;height:16px;flex:none;color:var(--blue);}
#alive-flow .help a b{font-weight:700;color:var(--text);}
#alive-flow .help a:hover b{color:var(--blue);}
#alive-flow .help p{font-size:11.5px;color:var(--text3);line-height:1.45;}

#alive-flow .nudge{display:flex;gap:9px;align-items:flex-start;background:var(--green-light);
  border:1px solid #bbf7d0;border-radius:var(--r);padding:9px 11px;font-size:12px;color:#15803d;
  line-height:1.5;}
#alive-flow .nudge svg{width:15px;height:15px;flex:none;margin-top:1px;}
#alive-flow .nudge b{font-weight:800;}
#alive-flow .nudge button{font-weight:800;text-decoration:underline;color:inherit;font-size:12px;}
/* ---- color grid ----------------------------------------------------- */
#alive-flow .swatches{display:flex;flex-wrap:wrap;gap:8px;}
#alive-flow .sw{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(0,0,0,.18);
  position:relative;flex:none;}
#alive-flow .sw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--blue);}
#alive-flow .sw:hover{transform:scale(1.08);}

/* ---- size grid ------------------------------------------------------- */
#alive-flow .sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:8px;}
#alive-flow .size{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r);
  padding:9px 6px 7px;text-align:center;}
#alive-flow .size.has{border-color:var(--blue);background:var(--blue-light);}
#alive-flow .size label{display:block;font-family:var(--disp);font-size:11px;font-weight:800;
  letter-spacing:.05em;color:var(--text2);}
#alive-flow .size input{width:100%;border:0;background:none;text-align:center;font-family:var(--disp);
  font-size:19px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;margin-top:3px;
  -moz-appearance:textfield;}
#alive-flow .size input::-webkit-outer-spin-button,
#alive-flow .size input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
#alive-flow .size input:focus{outline:none;}
#alive-flow .size u{display:block;text-decoration:none;font-size:10px;font-weight:700;
  color:var(--amber);min-height:13px;}
#alive-flow .sztot{display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);
  padding:11px 14px;margin-top:11px;font-size:13.5px;}
#alive-flow .sztot b{font-family:var(--disp);font-size:17px;font-weight:800;}
#alive-flow .sztot.ok b{color:var(--green);}
#alive-flow .sztot.off b{color:var(--amber);}
#alive-flow .sztot .szmin{font-style:normal;color:var(--text3);font-size:12px;}
#alive-flow .autofill{background:none;font-size:12px;color:var(--blue);text-decoration:underline;}

/* ---- ship line + zip ------------------------------------------------- */
#alive-flow .onesize{display:flex;gap:11px;align-items:flex-start;background:var(--blue-light);
  border:1px solid var(--blue-mid);border-radius:var(--r);padding:13px 15px;margin-top:4px;}
#alive-flow .onesize svg{width:18px;height:18px;flex:0 0 18px;color:var(--blue);margin-top:1px;}
#alive-flow .onesize span{font-size:12.5px;color:var(--text2);line-height:1.55;}
#alive-flow .onesize b{display:block;color:var(--text);font-size:13.5px;margin-bottom:3px;}
#alive-flow .shipline{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13px;
  color:var(--text2);}
#alive-flow .shipline svg{width:17px;height:17px;flex:none;color:var(--blue);margin-top:2px;}
#alive-flow .shipline b{color:var(--text);}
#alive-flow .shipline em{display:block;font-style:normal;font-size:12px;color:var(--text3);margin-top:3px;}
#alive-flow .zipin{display:flex;gap:9px;align-items:center;margin-top:10px;flex-wrap:wrap;}
#alive-flow .zipin input{width:118px;padding:8px 11px;border:1.5px solid var(--border2);
  border-radius:var(--r);font:inherit;font-variant-numeric:tabular-nums;letter-spacing:.06em;
  background:var(--surface);color:var(--text);}
#alive-flow .zipin input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-light);}
#alive-flow .zipout{font-size:12.5px;color:var(--text2);}
#alive-flow .zipout i{font-style:normal;color:var(--text3);}
#alive-flow .zipout u{text-decoration:none;color:var(--amber);}

#alive-flow .cta{margin-top:16px;}
#alive-flow .backlink{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 2px;
  font-family:var(--disp);font-size:13px;font-weight:700;text-decoration:none;background:none;width:100%;}
#alive-flow .backlink svg{width:15px;height:15px;}
#alive-flow .loading{padding:70px 20px;text-align:center;color:var(--text2);}

/* ---- review pass 24 Sep: mobile bar, included line, photo box --------- */
#alive-flow .incl{font-size:12px;color:var(--text2);line-height:1.5;margin-top:-6px;}
#alive-flow .incl b{color:var(--text);}
#alive-flow .mhelp{display:none;}
#alive-flow .mbar{display:none;}
/* The photo box was up to 540px tall, which pushed the colours and sizes
   below the fold on a 900px laptop. The artwork step keeps its own size. */
/* One fixed photo box for every product, colour and gallery photo, so the
   card never changes height when you switch (round 2). The photo is
   contained inside it. Step 3 keeps the product's own frame because the
   placement editor measures in fractions of it. */
#alive-flow .stage.compact{aspect-ratio:auto !important;width:100%;height:380px;max-height:none;}
#alive-flow .stage.compact .stage-art > img,#alive-flow .stage.compact .stage-art > video{object-fit:contain;}
/* Every gallery tile the same fixed square. */
#alive-flow .strip{grid-auto-columns:140px;}
@media(max-width:899px){
  #alive-flow{padding-bottom:88px;}
  #alive-flow .stage.compact{height:340px;}
  #alive-flow .strip{grid-auto-columns:120px;}
  /* Help moves from the top of the panel to the bottom of the page on a
     phone, so the task is the first thing on screen. */
  #alive-flow .panel .help{display:none;}
  #alive-flow .mhelp{display:block;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r-lg);padding:4px 16px 16px;margin-top:18px;}
  #alive-flow .mhelp .help{border-top:0;}
  /* Price + next step, always in reach. NOTE for the live build: inside the
     auto-height WordPress iframe position:fixed pins to the document, not the
     screen — it needs the AliveViewport helper from index.html. */
  #alive-flow .mbar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--border);
    box-shadow:0 -4px 18px rgba(15,17,23,.07);}
  #alive-flow .mbar-in{display:flex;align-items:center;gap:12px;padding:10px 14px;}
  #alive-flow .mbar .k{font-family:var(--disp);font-size:9.5px;font-weight:800;letter-spacing:.08em;
    text-transform:uppercase;color:var(--text3);}
  #alive-flow .mbar .v{font-family:var(--disp);font-size:19px;font-weight:800;letter-spacing:-.02em;
    color:var(--blue-dark);line-height:1.15;}
  #alive-flow .mbar .s{font-size:11px;color:var(--text3);}
  #alive-flow .mbar .cta{margin:0;flex:1 1 auto;width:auto;padding:14px 12px;font-size:12.5px;}
}
@media(max-width:899px){#alive-flow .shell > .panel{order:2;}}

/* ---- round 3: ? help buttons ----------------------------------------- */
#alive-flow .qi{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;
  border:1.5px solid var(--border2);background:#fff;color:var(--text2);font-family:var(--disp);
  font-size:10.5px;font-weight:800;line-height:1;margin-left:6px;vertical-align:middle;
  text-transform:none;letter-spacing:0;flex:none;cursor:pointer;}
#alive-flow .qi:hover{border-color:var(--blue);color:var(--blue);}
#alive-flow .tipbox{position:fixed;inset:0;z-index:95;background:rgba(15,17,23,.55);
  display:grid;place-items:center;padding:18px;}
#alive-flow .tipbox .tb{background:#fff;border-radius:var(--r-lg);max-width:420px;width:100%;

#alive-flow .cta:disabled{background:var(--border2);cursor:not-allowed;}
/* ---- 4-step progress bar (shared by all four steps) ----------------- */
#alive-flow .steps{background:var(--surface);border-bottom:1px solid var(--border);}
#alive-flow .steps-in{max-width:720px;margin:0 auto;padding:18px 16px 16px;

  display:grid;place-items:center;font-family:var(--disp);font-size:13px;font-weight:800;
  transition:background .15s,box-shadow .15s;}

#alive-flow .stp.done .nm{color:var(--text2);}
#alive-flow .stp.done{cursor:pointer;}
#alive-flow .stp.done:hover .dot{background:var(--blue-dark);}
#alive-flow .stp.done:hover .nm{color:var(--blue);}

}
/* ---- step shell: control panel + product card + media strip --------- */
/* minmax(0,1fr), not the default auto — an auto track lets the media strip
   push the page wider than the viewport on a phone. */
#alive-flow .shell{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding-block:22px 6px;}
#alive-flow .shell > *{min-width:0;}
@media(min-width:900px){#alive-flow .shell{grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:22px;align-items:start;}}

/* left control panel */

#alive-flow .panel .cap{font-family:var(--disp);font-size:11px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--text2);margin-bottom:9px;}

/* price tiles */
#alive-flow .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
#alive-flow .tile{border-radius:var(--r-lg);padding:11px 13px;border:1.5px solid transparent;}
#alive-flow .tile .k{font-family:var(--disp);font-size:9px;font-weight:800;letter-spacing:.09em;

#alive-flow .tile.unit{background:var(--blue-light);border-color:var(--blue-mid);color:var(--blue-dark);}

#alive-flow .qty{display:flex;align-items:center;justify-content:space-between;gap:12px;}

#alive-flow .qtybox{display:flex;align-items:center;gap:2px;background:var(--surface2);
  border:1.5px solid var(--border);border-radius:999px;padding:3px;}
#alive-flow .qtybox button{width:32px;height:32px;border-radius:50%;font-size:19px;font-weight:700;
  color:var(--text2);display:grid;place-items:center;line-height:1;}
#alive-flow .qtybox button:hover:not(:disabled){background:#fff;color:var(--blue);}
#alive-flow .qtybox button:disabled{opacity:.35;cursor:not-allowed;}
#alive-flow .qtybox input{width:54px;border:0;background:none;text-align:center;font:inherit;
  font-family:var(--disp);font-size:16px;font-weight:800;color:var(--text);
  font-variant-numeric:tabular-nums;-moz-appearance:textfield;}
#alive-flow .qtybox input::-webkit-outer-spin-button,
#alive-flow .qtybox input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
#alive-flow .qtynote{font-size:12px;color:var(--text3);line-height:1.5;}
#alive-flow .qtynote.warn{color:var(--amber);}

/* product card on the right */
#alive-flow .pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:16px 16px 14px;position:relative;}
#alive-flow .pcard .brand{font-family:var(--disp);font-size:10.5px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--blue);}
#alive-flow .pcard h2{font-size:17px;font-weight:800;margin-top:3px;}
#alive-flow .pcard .style{font-size:12.5px;color:var(--text3);margin-top:2px;}
/* The stage takes the PRODUCT's aspect, not a fixed 4:5, and the photo box
   fills it exactly. Two bugs came from the old version:
     - a 1:1 cap photo in a 4:5 stage was 540 wide inside a 432-wide box, so
       overflow:hidden clipped the bill on both sides;
     - max-height derived a width narrower than the card, and without
       margin-inline:auto the whole thing sat left of centre on desktop.
   productCard() writes the aspect from the profile's `frame`. */
#alive-flow .stage{margin:12px auto 0;position:relative;aspect-ratio:2/3;max-height:540px;
  background:#fff;border-radius:var(--r);overflow:hidden;}
/* The art box tracks the PHOTO, not the card, so overlays land in photo
   coordinates. SanMar flat lays are all 1200x1800 (2:3); a manually added
   supplier photo can be any shape, so each profile states its own `frame`
   and productCard() writes it here. Get this wrong and placed artwork sits
   in the letterbox instead of on the garment. */
#alive-flow .stage-art{position:absolute;inset:0;}
#alive-flow .stage-art > img{width:100%;height:100%;object-fit:contain;display:block;}
/* A SanMar cap flat is the same 1200x1800 frame as a shirt, but the cap only
   fills the top third of it, so an untouched flat renders as a small object
   floating in white. .zoomed scales the photo about its own upper area on the
   steps that only DISPLAY it. Step 3 never sets this: the placement editor's
   coordinates are fractions of the untouched frame. */
/* The cap occupies y 0.02-0.42 of its flat, centred at 0.22. To land that
   centre at 0.5 of the box at scale s, the origin is o where
   0.5 = o + (0.22 - o)s  ->  o = -0.13 at s = 1.8. */
#alive-flow .stage-art.zoomed > img{transform:scale(1.8);transform-origin:50% -13%;}
#alive-flow .sides{display:flex;gap:0;justify-content:center;margin-top:10px;}
#alive-flow .sides button{font-family:var(--disp);font-size:11px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text2);background:var(--surface2);border:1.5px solid var(--border);
  padding:7px 20px;}
#alive-flow .sides button:first-child{border-radius:var(--r) 0 0 var(--r);}
#alive-flow .sides button:last-child{border-radius:0 var(--r) var(--r) 0;border-left:0;}
#alive-flow .sides button.on{background:var(--blue);border-color:var(--blue);color:#fff;}

/* a block joined to the bottom of the product card (color grid, size grid) */
#alive-flow .pcard-foot{border-top:1px solid var(--border);margin:14px -16px 0;padding:16px 16px 2px;}
#alive-flow .pcard-foot .fhead{display:flex;justify-content:space-between;align-items:baseline;
  gap:12px;margin-bottom:11px;}
#alive-flow .pcard-foot .fhead .lbl{font-family:var(--disp);font-size:11.5px;font-weight:800;
  letter-spacing:.09em;text-transform:uppercase;color:var(--text2);}
#alive-flow .pcard-foot .fhead .lbl b{color:var(--text);}
#alive-flow .pcard-foot .fhead .aux{font-family:var(--disp);font-size:11px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:var(--text3);}

/* media strip */
/* No visible scrollbar: the tiles are draggable, which is what a phone does
   natively and what pointer events below give a mouse. */
#alive-flow .strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(128px,1fr);gap:10px;
  overflow-x:auto;padding:16px 0 4px;scrollbar-width:none;-ms-overflow-style:none;
  scroll-snap-type:x proximity;cursor:grab;}
#alive-flow .strip::-webkit-scrollbar{display:none;}
#alive-flow .strip.dragging{cursor:grabbing;scroll-snap-type:none;}
/* Without this the browser starts its own image-drag as soon as the pointer

#alive-flow .strip img{-webkit-user-drag:none;user-drag:none;user-select:none;}

  background:var(--surface2);border:1px solid var(--border);}

#alive-flow .strip .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;

  font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;}

#alive-flow .help{border-top:1px solid var(--border);padding-top:14px;display:grid;gap:7px;}

    if(p.case_sale_price!=null&&!isNaN(p.case_sale_price))p.case_sale_price=parseFloat((p.case_sale_price+stdUp).toFixed(2));

    if(!isExtendedSize(sz))return;

  p.case_sale_price=null;

  Object.keys(BASIC_TEE_DEAL_COST_BYSIZE).forEach(function(sz){
    var d=parseFloat((BASIC_TEE_DEAL_COST_BYSIZE[sz]-BASIC_TEE_DEAL_COST_BASE).toFixed(2));if(d>0)up[sz]=d;});

  if(manual){ p._blank = p._drinkware ? dwFromPrice(p) : (p.p||null); return p; }
  if(p.discontinued===true)return null;

  applyBasicTeeDeal(p);
  var base=(p.case_sale_price!=null)?p.case_sale_price:p.case_price;

/* ---- product type, methods, locations -------------------------------- */
function productType(p){
  if(!p)return 'other';

  var cat=String(p.category||'').toLowerCase(), name=String(p.name||'').toLowerCase();
  if(cat.indexOf('cap')>-1){
    if(/(\bbeanie\b|\bknit\s*cap\b|\bknit\s*hat\b|\bknit\s*beanie\b)/.test(name))return 'beanie';
    return 'hat';
  }
  if(cat.indexOf('bag')>-1)return 'bag';
  if(cat.indexOf('outerwear')>-1)return 'jacket';
  if(cat.indexOf('polo')>-1||cat.indexOf('knit')>-1||cat.indexOf('woven')>-1)return 'polo';
  if(cat.indexOf('sweatshirt')>-1||cat.indexOf('fleece')>-1)return 'sweatshirt';
  if(cat.indexOf('bottom')>-1)return 'bottom';
  if(cat==='t-shirts'||cat==='activewear'||cat==='workwear'||cat==='personal protection'||cat==="women's"||cat==='youth'||cat==='infant & toddler'||cat==='tall'||cat==='accessories')return 'tshirt';

function isFoamTrucker(p){return !!FOAM_TRUCKER_STYLES[String((p&&p.style)||'').toUpperCase()];}

  switch(productType(p)){
    case 'tshirt':return ['sp','ht']; case 'sweatshirt':return ['sp','ht','em'];
    case 'polo':return ['em','ht']; case 'jacket':return ['em','ht'];
    case 'hat':return ['em','ht']; case 'beanie':return ['em'];

function locations(p, method){
  if(!p)return [];

  if(pt==='hat'&&isFoamTrucker(p))return [{key:'front',label:'Front',cls:'front'}];
  if(method==='em'){
    switch(pt){
      case 'hat':return [{key:'front',label:'Front',cls:'front'},{key:'back',label:'Back',cls:'side'},{key:'left-side',label:'Left Side',cls:'side'},{key:'right-side',label:'Right Side',cls:'side'}];
      case 'beanie':return [{key:'front',label:'Front',cls:'front'},{key:'back',label:'Back',cls:'side'}];
      case 'polo': case 'jacket':
        return [{key:'left-chest',label:'Left Chest',cls:'front'},{key:'right-chest',label:'Right Chest',cls:'front'},{key:'left-sleeve',label:'Left Sleeve',cls:'side'},{key:'right-sleeve',label:'Right Sleeve',cls:'side'}];
      case 'bag':return [{key:'front-center',label:'Front Center',cls:'front'}];
      case 'sweatshirt':return [{key:'front-center',label:'Front Center (8" max)',cls:'front'},{key:'left-sleeve',label:'Left Sleeve',cls:'side'},{key:'right-sleeve',label:'Right Sleeve',cls:'side'}];
      default:return [];
    }

function emLocCls(p,key){
  var list=locations(p,'em');

function orderMethod(p,cfg){

    ks.sort(function(a,b){return a-b;});if(ks.length)return ks;

function colorsIdx(n){var v=parseInt(n,10);if(!v||v<1)v=1;return v-1;}

  var c=0,anyEM=false,qb=getQB(qty),htp=pick(HT_BREAKS,qty),hts=pick(HT_SMALL_BREAKS,qty),eqb=getEMQB(qty);

  var fe=colorsIdx(cfg.frontColors), be=colorsIdx(cfg.backColors);
  if(deal&&fe>=0&&fe<=2)fe=0;
  if(deal&&be>=0&&be<=2)be=0;

    var m=(cfg.locMethod||{})[key]||'sp';
    var isSleeve=(key==='left-sleeve'||key==='right-sleeve');

    if(m==='em'){anyEM=true;c+=(emLocCls(p,key)==='front')?EM_FRONT[eqb]:EM_SIDE[eqb];}

function _hexToRgb(hex){
  hex=String(hex).replace('#','');
  if(hex.length===3)hex=hex.split('').map(function(c){return c+c;}).join('');
  return [parseInt(hex.substr(0,2),16),parseInt(hex.substr(2,2),16),parseInt(hex.substr(4,2),16)];
}
function _rgbToHex(r,g,b){

var AliveBgRemove=(function(){

  function d2(a,b){var r=a[0]-b[0],g=a[1]-b[1],bb=a[2]-b[2];return r*r+g*g+bb*bb;}
  function seg(p,a,b){
    var x=b[0]-a[0],y=b[1]-a[1],z=b[2]-a[2];
    var px=p[0]-a[0],py=p[1]-a[1],pz=p[2]-a[2];
    var L=x*x+y*y+z*z; if(L===0)return Math.sqrt(d2(p,a));
    var t=(px*x+py*y+pz*z)/L; if(t<0)t=0; else if(t>1)t=1;
    return Math.sqrt(d2(p,[a[0]+x*t,a[1]+y*t,a[2]+z*t]));
  }
  function bgOf(data,w,h,am){
    var c={},tot=0;
    function s(x,y){var i=(y*w+x)*4;if(data[i+3]<am)return;
      var k=(data[i]>>3)+','+(data[i+1]>>3)+','+(data[i+2]>>3);c[k]=(c[k]||0)+1;tot++;}
    for(var x=0;x<w;x++){s(x,0);s(x,h-1);} for(var y=0;y<h;y++){s(0,y);s(w-1,y);}
    if(!tot)return null;
    var bk=null,bn=0; for(var k in c) if(c[k]>bn){bn=c[k];bk=k;}
    if(!bk||bn/tot<0.7)return null;
    var p=bk.split(',');return [(+p[0]<<3)+4,(+p[1]<<3)+4,(+p[2]<<3)+4];
  }
  function hex(v){return '#'+v.map(function(x){return ('0'+Math.round(x).toString(16)).slice(-2);}).join('');}
  function detect(img,opt){
    var o={},k;for(k in DEF)o[k]=DEF[k];if(opt)for(k in opt)o[k]=opt[k];
    var W=img.naturalWidth||img.width,H=img.naturalHeight||img.height;
    if(!W||!H)return {ok:false,reason:'no-image'};
    var sc=Math.min(1,o.sample/Math.max(W,H));
    var cw=Math.max(1,Math.round(W*sc)),ch=Math.max(1,Math.round(H*sc));
    var cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
    var ctx=cv.getContext('2d',{willReadFrequently:true});
    ctx.clearRect(0,0,cw,ch);
    try{ctx.drawImage(img,0,0,cw,ch);}catch(e){return {ok:false,reason:'draw'};}
    var dat;try{dat=ctx.getImageData(0,0,cw,ch).data;}catch(e){return {ok:false,reason:'tainted'};}
    var bg=o.dropBackground?bgOf(dat,cw,ch,o.alphaMin):null;
    var sh=8-o.quantBits,bu={},fine={},art=0,tr=0;
    for(var i=0;i<dat.length;i+=4){
      if(dat[i+3]<o.alphaMin){tr++;continue;}
      var r=dat[i],g=dat[i+1],b=dat[i+2];
      if(bg&&d2([r,g,b],bg)<324)continue;
      var key=(r>>sh)+'_'+(g>>sh)+'_'+(b>>sh),e=bu[key];
      if(e){e.n++;e.r+=r;e.g+=g;e.b+=b;}else bu[key]={n:1,r:r,g:g,b:b};
      var fb=o.fineBits,fk=(r>>fb)+'_'+(g>>fb)+'_'+(b>>fb);
      fine[fk]=(fine[fk]||0)+1; art++;
    }
    if(!art)return {ok:false,reason:'empty'};
    var list=[];for(var q in bu){var E=bu[q];list.push({n:E.n,rgb:[E.r/E.n,E.g/E.n,E.b/E.n]});}
    var raw=list.length; list.sort(function(a,b){return b.n-a.n;});
    var cl=[],md=o.mergeDist*o.mergeDist;
    for(var li=0;li<list.length;li++){
      var it=list[li],hit=null;
      for(var ci=0;ci<cl.length;ci++)if(d2(it.rgb,cl[ci].rgb)<md){hit=cl[ci];break;}
      if(hit){var t=hit.n+it.n;
        hit.rgb=[(hit.rgb[0]*hit.n+it.rgb[0]*it.n)/t,(hit.rgb[1]*hit.n+it.rgb[1]*it.n)/t,(hit.rgb[2]*hit.n+it.rgb[2]*it.n)/t];
        hit.n=t;}
      else cl.push({n:it.n,rgb:it.rgb.slice()});
    }
    cl.sort(function(a,b){return b.n-a.n;});
    var kept=[];
    for(var z=0;z<cl.length;z++){
      var c=cl[z],blend=false;
      for(var a1=0;a1<kept.length&&!blend;a1++)for(var a2=a1+1;a2<kept.length;a2++){
        if(c.n>Math.min(kept[a1].n,kept[a2].n)*o.blendMaxRatio)continue;
        if(seg(c.rgb,kept[a1].rgb,kept[a2].rgb)<o.blendDist){blend=true;break;}
      }
      if(!blend&&bg)for(var a3=0;a3<kept.length;a3++){
        if(c.n>kept[a3].n*o.blendMaxRatio)continue;
        if(seg(c.rgb,kept[a3].rgb,bg)<o.blendDist){blend=true;break;}
      }
      if(blend){var nr=null,nd=Infinity;
        for(var kk=0;kk<kept.length;kk++){var dd=d2(c.rgb,kept[kk].rgb);if(dd<nd){nd=dd;nr=kept[kk];}}
        if(nr)nr.n+=c.n;
      } else kept.push(c);
    }
    var solid=kept.filter(function(c){return c.n/art>=o.minShare;});
    if(!solid.length&&kept.length)solid=[kept[0]];
    solid.sort(function(a,b){return b.n-a.n;});
    var fc=[];for(var f2 in fine)fc.push(fine[f2]);
    fc.sort(function(a,b){return b-a;});
    var acc=0,t90=0,need=art*0.9;
    for(var fi=0;fi<fc.length;fi++){acc+=fc[fi];t90++;if(acc>=need)break;}
    var photo=(t90>o.toneSpread&&solid.length>=3)||solid.length>16;
    return {ok:true,count:photo?null:solid.length,photoish:photo,tones90:t90,
      colors:solid.slice(0,12).map(function(c){return {hex:hex(c.rgb),share:c.n/art};}),
      backgroundDropped:!!bg,hasTransparency:tr>0};
  }
  return {detect:detect};
})();

(function(){
  var W=window, D=document;
  var api={slice:null, subscribe:sub, refresh:schedule, embedded:false};
  W.AliveViewport=api;
  var subs=[];
  function sub(fn){ if(typeof fn==='function'){subs.push(fn); if(api.slice)fn(api.slice);} }
  function emit(){ for(var i=0;i<subs.length;i++){ try{subs[i](api.slice);}catch(e){} } }

  // Parent-pushed override (backwards compatible with the older embed snippet).
  W.addEventListener('message',function(e){
    var d=e&&e.data;
    if(!d||typeof d!=='object'||d.type!=='alive-viewport')return;
    var t=parseFloat(d.visTop), b=parseFloat(d.visBottom);
    if(isNaN(t)||isNaN(b)||b<=t)return;
    _parentPushed=true;
    api.embedded=true;
    D.documentElement.classList.add('proj-embedded');
    api.slice={visTop:t, visBottom:b};
    emit();
  },false);
  var _parentPushed=false;

  if(W.self===W.top)return;              // not embedded: fixed positioning works
  if(!W.IntersectionObserver)return;     // no way to measure: callers fall back

  api.embedded=true;
  D.documentElement.classList.add('proj-embedded');

  var body=D.body;
  if(!body){ D.addEventListener('DOMContentLoaded',start); } else { start(); }

  var ladderHost, measureEl, ladderIO, rungs=0, RUNG=120, pending=false;

  function docH(){ return Math.max(body.scrollHeight, body.offsetHeight, 1); }

  function start(){
    body=D.body;
    // The ladder and the measuring strip are 1px wide, out of flow and behind
    // everything. They must never affect layout — in particular they must never
    // change body.scrollHeight, which the iframe auto-resize broadcast measures.
    ladderHost=D.createElement('div');
    ladderHost.setAttribute('aria-hidden','true');
    ladderHost.style.cssText='position:absolute;top:0;left:0;width:1px;height:0;pointer-events:none;visibility:hidden;z-index:-1;';
    body.appendChild(ladderHost);

    measureEl=D.createElement('div');
    measureEl.setAttribute('aria-hidden','true');
    // Overshoots UPWARDS only. Overflow above the origin is not scrollable, so
    // this cannot change body.scrollHeight — which matters, because the iframe
    // auto-resize broadcast measures exactly that, and inflating it would start
    // the runaway height-feedback loop. Overshooting DOWNWARDS would do that.
    measureEl.style.cssText='position:absolute;top:-2000px;left:0;width:1px;pointer-events:none;visibility:hidden;z-index:-1;';
    body.appendChild(measureEl);

    ladderIO=new IntersectionObserver(schedule,{threshold:0});
    build();
    if(W.ResizeObserver){ new ResizeObserver(function(){build();schedule();}).observe(body); }
    else { setInterval(function(){build();schedule();},600); }
    W.addEventListener('resize',schedule);
    W.addEventListener('load',function(){build();schedule();});
    schedule();
  }

  function build(){
    if(!ladderHost)return;
    var h=docH();
    measureEl.style.height=(h+2000)+'px';
    var need=Math.max(1,Math.ceil(h/RUNG));
    if(need===rungs)return;
    while(rungs>need){ var last=ladderHost.lastChild; if(!last)break; ladderIO.unobserve(last); ladderHost.removeChild(last); rungs--; }
    for(var i=rungs;i<need;i++){
      var d=D.createElement('div');
      d.style.cssText='position:absolute;left:0;width:1px;height:'+RUNG+'px;top:'+(i*RUNG)+'px;';
      ladderHost.appendChild(d);
      ladderIO.observe(d);
    }
    rungs=need;
  }

  function schedule(){
    if(_parentPushed||pending)return;
    pending=true;
    W.requestAnimationFrame(function(){ pending=false; remeasure(); });
  }

  function remeasure(){
    if(!measureEl)return;
    var io=new IntersectionObserver(function(entries){
      io.disconnect();
      var r=entries[0]&&entries[0].intersectionRect;
      var next=null;
      if(r&&r.height>0){
        var sy=W.pageYOffset||D.documentElement.scrollTop||0;
        next={visTop:r.top+sy, visBottom:r.bottom+sy};
      }
      var a=api.slice;
      if(a&&next&&Math.abs(a.visTop-next.visTop)<1&&Math.abs(a.visBottom-next.visBottom)<1)return;
      if(!a&&!next)return;
      api.slice=next;
      emit();
    },{threshold:0});
    io.observe(measureEl);
  }
})();

<script>
/* =====================================================================

/* ---------------------------------------------------------------- utils */

/* Anything that must sit on the customer's SCREEN (footer bar, pop-ups).

/* Host bar: the WordPress snippet draws the footer bar on the real page
   (true position:fixed, no lag) and relays taps back here. Our own bar is

var HOST = false, lastBar = '';
function barModel(){
  var bar = root.querySelector('.mbar'); if(!bar) return {show:false};

/* ------------------------------------------------------------ pricing */
function sizeTotal(){ var t = 0; for(var k in S.sizes) t += (+S.sizes[k] || 0); return t; }

/* ------------------------------------------------------------ colors */
function sortColors(list){
  var out = list.slice();
  out.sort(function(a,b){
    var an = (a.name||'').toLowerCase(), bn = (b.name||'').toLowerCase();
    if(an === 'black' && bn !== 'black') return -1; if(bn === 'black' && an !== 'black') return 1;
    if(an === 'white' && bn !== 'white') return -1; if(bn === 'white' && an !== 'white') return 1;
    return an.localeCompare(bn);
  });
  return out;
}
function swatchStyle(c){
  var two = window.resolveTwoTone ? resolveTwoTone(c.name) : null;
  if(two) return 'background:linear-gradient(135deg,' + two[0] + ' 50%,' + two[1] + ' 50%)';
  var hx = HEX_FIX[String(c.name||'').toLowerCase().trim()] || (window.resolveColorHex ? resolveColorHex(c.name, c.hex) : (c.hex || '#ccc'));
  return 'background:' + hx;
}
function colorFront(c){ var i = c.images || {}; return i.front_flat || i.front_model || i.back_flat || ''; }
function colorBack(c){ var i = c.images || {}; return i.back_flat || i.back_model || null; }

/* ------------------------------------------------------------ chrome */
function stepper(cur){
  var defs = [{n:1,label:'Color &amp; Sizes'},{n:2,label:'Artwork'},{n:3,label:'Checkout'}];
  var out = '<div class="steps"><div class="steps-in">';
  defs.forEach(function(s, i){
    var done = s.n < cur, now = s.n === cur;
    var inner = '<span class="dot">' + (done ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><path d="M20 6L9 17l-5-5"/></svg>' : s.n) + '</span><span class="nm">' + s.label + '</span>';
    out += done ? '<button type="button" class="stp done" data-goto="' + (s.n === 1 ? 'sizes' : 'artwork') + '">' + inner + '</button>'
                : '<span class="stp ' + (now ? 'now' : '') + '">' + inner + '</span>';
    if(i < defs.length - 1) out += '<span class="rule' + (done ? ' done' : '') + '"></span>';
  });
  return out + '</div></div>';
}

function mbar(label, disabled, sub){

/* ------------------------------------------------------------ gallery */
function galleryItems(c){
  var out = [];
  var f = colorFront(c), b = colorBack(c);
  if(f) out.push({kind:'view', side:'front', img:f, alt:'Front'});
  if(b) out.push({kind:'view', side:'back', img:b, alt:'Back'});
  CONFIG.media.forEach(function(m, i){ out.push({kind:'media', i:i, img:m.img, alt:m.alt}); });
  return out;
}
function heroImage(c){
  if(S.gal != null) return CONFIG.media[S.gal].img;
  var b = colorBack(c);
  return (S.side === 'back' && b) ? b : colorFront(c);
}
function mediaStrip(c){
  return '<div class="strip" id="f-strip">' + galleryItems(c).map(function(m){
    var key = m.kind === 'view' ? 'view:' + m.side : 'media:' + m.i;
    var on = m.kind === 'view' ? (S.gal == null && S.side === m.side) : S.gal === m.i;
    return '<button type="button" class="gtile' + (on ? ' on' : '') + '" data-gal="' + key + '" aria-label="' + esc(m.alt) + '">' +
      '<figure><img src="' + esc(m.img) + '" alt="' + esc(m.alt) + '" loading="lazy"></figure></button>';
  }).join('') + '</div>';
}
function wireStrip(){
  var row = document.getElementById('f-strip'); if(!row) return;
  var down = false, moved = 0, x0 = 0, left0 = 0;
  row.addEventListener('dragstart', function(e){ e.preventDefault(); });
  row.addEventListener('pointerdown', function(e){ if(e.pointerType === 'touch') return;
    down = true; moved = 0; x0 = e.clientX; left0 = row.scrollLeft; row.classList.add('dragging'); e.preventDefault(); });
  row.addEventListener('pointermove', function(e){ if(!down) return; var dx = e.clientX - x0;
    if(Math.abs(dx) > moved) moved = Math.abs(dx); row.scrollLeft = left0 - dx; });
  function end(){ down = false; row.classList.remove('dragging'); }
  row.addEventListener('pointerup', end); row.addEventListener('pointerleave', end); row.addEventListener('pointercancel', end);
  row.addEventListener('click', function(e){ if(moved > 6){ e.preventDefault(); e.stopPropagation(); moved = 0; } }, true);
  root.querySelectorAll('[data-gal]').forEach(function(b){
    b.onclick = function(){ var p = b.dataset.gal.split(':');
      if(p[0] === 'view'){ S.gal = null; S.side = p[1]; } else S.gal = +p[1];
      render(); };
  });
}

/* ------------------------------------------------------------ product card */
function productCard(overlayHtml, foot, rail){
  var p = S.p, c = S.colors[S.color];
  var editor = S.phase === 'artwork';
  var fr = S.frame[S.color];
  var frame = editor ? (fr ? (fr + '') : '0.6667') : null;
  /* Zoom past the white border SanMar leaves around the product
     (crops.json, measured per style). The art box keeps the whole photo's
     shape, so placement coordinates are unchanged; the stage just shows
     the part of it where the product is. */
  var cr = S.gal == null && CROPS[String(p.style).toUpperCase()], box = cr && cr[S.side === 'back' && colorBack(c) ? 'b' : 'f'];
  var stageStyle = editor ? ' style="aspect-ratio:' + frame + '"' : '', artStyle = '';
  if(box){
    var cw = box[2] - box[0], ch = box[3] - box[1], ratio = +(cw * box[4] / ch).toFixed(4), maxH = editor ? 540 : (window.innerWidth < 560 ? 360 : 420);
    stageStyle = ' style="--ar:' + ratio + ';width:min(100%,' + Math.round(maxH * ratio) + 'px)"';
    artStyle = ' style="inset:auto;left:' + (-box[0] / cw * 100).toFixed(3) + '%;top:' + (-box[1] / ch * 100).toFixed(3) + '%;width:' + (100 / cw).toFixed(3) + '%;height:' + (100 / ch).toFixed(3) + '%"';
  }
  var sides = S.gal == null && colorBack(c)
    ? '<div class="sides"><button type="button" data-side="front" class="' + (S.side === 'front' ? 'on' : '') + '">Front</button>' +
      '<button type="button" data-side="back" class="' + (S.side === 'back' ? 'on' : '') + '">Back</button></div>' : '';
  return '<div class="pcard">' +
    '<div class="brand">' + esc(p.brand || '') + (p._dealBasicTee ? ' <span class="bv">★ Best value</span>' : '') + '</div>' +
    '<h2>' + esc(cleanName(p)) + '</h2>' +
    '<div class="style">Style #' + esc(p.style) + (c ? ' — ' + esc(c.name) : '') + '</div>' +
    '<div class="stage' + (editor ? '' : ' compact') + (box ? ' cropped' : '') + '"' + stageStyle + '>' +
      '<div class="stage-art" id="f-stage"' + artStyle + '><img src="' + esc(heroImage(c)) + '" alt="' + esc(cleanName(p)) + '">' +
      (editor && S.gal == null ? (overlayHtml || '') : '') + '</div></div>' +
    sides + (foot ? '<div class="pcard-foot">' + foot + '</div>' : '') + (rail || '') +
  '</div>';
}
function cleanName(p){
  var n = String(p.name || '').replace(/&amp;/g,'&');
  /* SanMar names end with the style number ("... Tee. NL6210"); drop it. */
  n = n.replace(new RegExp('[.\\s]*' + String(p.style).replace(/[-/\\^$*+?.()|[\]{}]/g,'\\$&') + '\\s*$'), '');
  n = n.replace(/^(.*?)\s-\s/, function(m, brand){ return brand.toLowerCase() === String(p.brand||'').toLowerCase() ? '' : m; });
  var b = String(p.brand||'');
  if(b && n.toLowerCase().indexOf(b.toLowerCase() + ' ') === 0) n = n.slice(b.length + 1);
  return n.trim() || p.style;
}

function setMethod(m){
  S.method = m;
  LOC = {};
  E.locations(S.p, m).forEach(function(l){ LOC[l.key] = {key:l.key, label:l.label, cls:l.cls, side:LOC_VIEW[l.key] === undefined ? 'front' : LOC_VIEW[l.key]}; });
  /* Keep the spots that still exist under the new method; else the first. */
  S.locs = S.locs.filter(function(k){ return LOC[k]; });
  if(!S.locs.length) S.locs = [defaultLoc(m)];
  Object.keys(S.art).forEach(function(k){ if(!LOC[k]) delete S.art[k]; });
}
function methodTabs(){
  var ms = E.decoMethods(S.p);
  if(ms.length < 2) return '<div class="sec-lbl">Decoration' + tip('method') + '</div><div class="onlym">' + esc(E.methodLabel(ms[0])) + '</div>';

function needsInkCount(k){ return S.method === 'sp' && !S.p._drinkware ? (k !== 'left-sleeve' && k !== 'right-sleeve') : !!S.p._drinkware; }

/* placement editor (ported from the demo, which ported it from v2) */
function layersFor(side){ return S.locs.filter(function(k){ return S.art[k] && S.art[k].src && LOC[k] && LOC[k].side === side; }); }
function overlay(){
  var here = layersFor(S.side);
  var picked = !!S.sel && here.indexOf(S.sel) > -1;
  var layers = here.map(function(k){
    var d = S.art[k], p = d.place;
    return '<div class="layer' + (S.sel === k ? ' sel' : '') + '" data-layer="' + k + '" style="left:' + (p.cx*100) + '%;top:' + (p.cy*100) + '%;width:' + (p.w*100) + '%;transform:translate(-50%,-50%) rotate(' + p.rot + 'deg);">' +
      '<img src="' + esc(d.src) + '" alt="">' +
      '<span class="h h-del" data-h="del" title="Remove">&#x2715;</span><span class="h h-rot" data-h="rot" title="Rotate">&#8635;</span><span class="h h-size" data-h="size" title="Resize">&#8690;</span></div>';
  }).join('');
  return layers + '<div class="hint">' + (!here.length ? (S.mode === 'later' ? '' : 'Upload a design below to place it here.')
    : (picked ? 'Drag to move. Corner handles resize and rotate.' : 'Tap your design to move or resize it.')) + '</div>';
}
function toolTarget(){ var here = layersFor(S.side); if(S.sel && here.indexOf(S.sel) > -1) return S.sel; return here.length === 1 ? here[0] : null; }
function tools(){
  var on = !!toolTarget();
  function b(act, label, path){ return '<button type="button" data-tool="' + act + '"' + (on ? '' : ' disabled') + '><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">' + path + '</svg>' + label + '</button>'; }
  return '<div class="tools">' + b('center','Center','<path d="M12 3v18M3 12h18"/><rect x="8" y="8" width="8" height="8" rx="1"/>') +
    b('zoomin','Bigger','<circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M20 20l-3.5-3.5"/>') +
    b('zoomout','Smaller','<circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-3.5-3.5"/>') + '</div>';
}
function applyLayerStyle(key){
  var el = root.querySelector('.layer[data-layer="' + key + '"]'), d = S.art[key];
  if(!el || !d) return;
  el.style.left = (d.place.cx*100) + '%'; el.style.top = (d.place.cy*100) + '%';
  el.style.width = (d.place.w*100) + '%'; el.style.transform = 'translate(-50%,-50%) rotate(' + d.place.rot + 'deg)';
}
function startDrag(e, key, mode){
  e.preventDefault(); e.stopPropagation();
  var stage = document.getElementById('f-stage'), d = S.art[key];
  if(!d || !stage) return;
  var box = stage.getBoundingClientRect(), start = {x:e.clientX, y:e.clientY};
  var p0 = {cx:d.place.cx, cy:d.place.cy, w:d.place.w, rot:d.place.rot};
  var cx0 = box.left + p0.cx*box.width, cy0 = box.top + p0.cy*box.height;
  var r0 = Math.sqrt(Math.pow(e.clientX-cx0,2) + Math.pow(e.clientY-cy0,2)), a0 = Math.atan2(e.clientY-cy0, e.clientX-cx0);
  root.querySelectorAll('.layer').forEach(function(el){ el.classList.toggle('sel', el.getAttribute('data-layer') === key); });
  function move(ev){
    var q = S.art[key]; if(!q) return;
    if(mode === 'move'){ q.place.cx = Math.min(1.1, Math.max(-0.1, p0.cx + (ev.clientX-start.x)/box.width));
                         q.place.cy = Math.min(1.1, Math.max(-0.1, p0.cy + (ev.clientY-start.y)/box.height)); }
    else if(mode === 'size'){ var r = Math.sqrt(Math.pow(ev.clientX-cx0,2) + Math.pow(ev.clientY-cy0,2)); q.place.w = Math.min(1.6, Math.max(0.03, p0.w * (r0 > 4 ? r/r0 : 1))); }
    else if(mode === 'rot'){ var a = Math.atan2(ev.clientY-cy0, ev.clientX-cx0); q.place.rot = p0.rot + (a-a0)*180/Math.PI; }
    applyLayerStyle(key);
  }
  function up(){ window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); }
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
}

/* upload + analysis */
function pickFile(k){
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*,.pdf,.ai,.eps,.svg,.psd,.zip,application/pdf,application/postscript,application/zip';
  inp.onchange = function(){ var f = inp.files && inp.files[0]; if(f) takeFile(k, f); };
  inp.click();
}
function thumbFrom(im){
  try{ var s = 96, cv = document.createElement('canvas'), r = Math.min(s/im.naturalWidth, s/im.naturalHeight);
    cv.width = Math.max(1, Math.round(im.naturalWidth*r)); cv.height = Math.max(1, Math.round(im.naturalHeight*r));
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); return cv.toDataURL('image/png'); }catch(e){ return ''; }
}
function takeFile(k, file){
  S.err = '';
  if(file.size > CONFIG.maxFileMB * 1024 * 1024){ S.err = file.name + ' is over ' + CONFIG.maxFileMB + ' MB. Email it to ' + CONFIG.email + ' instead.'; render(); return; }
  S.busy = k; render();
  var fr = new FileReader();
  fr.onload = function(){
    var src = fr.result, im = new Image();
    im.onload = function(){
      var det = {ok:false};
      try{ det = AliveArtColors.detect(im); }catch(e){}
      S.art[k] = {name:file.name, src:src, thumb:thumbFrom(im), colors:(det.ok && det.colors) || [], photoish:!!(det.ok && det.photoish),
                  url:'', key:'', uploadFailed:false, bgRemoved:false, bgBusy:false, bgMsg:'', place:defaultPlace(k)};
      /* The detected ink count becomes the default; the customer can change it. */
      if(det.ok && det.count && !det.photoish) S.inks[k] = Math.min(E.MAX_INK, det.count);
      S.busy = null; S.sel = k; if(LOC[k].side) { S.side = LOC[k].side; S.gal = null; }
      render(); upload(k, file);
    };
    im.onerror = function(){
      S.art[k] = {name:file.name, src:'', thumb:'', colors:[], photoish:false, url:'', key:'', uploadFailed:false, noPreview:true, place:defaultPlace(k)};
      S.busy = null; render(); upload(k, file);
    };
    im.src = src;
  };
  fr.onerror = function(){ S.busy = null; S.err = 'We could not read that file.'; render(); };
  fr.readAsDataURL(file);
}
/* Uploads start as soon as a file is picked, retry on a bad connection,
   and checkout waits for them (see addToCart) so a file is never lost by
   tapping Continue while it is still on its way. */
function upload(k, blob, filename){
  var d0 = S.art[k]; if(!d0) return Promise.resolve();
  var name = filename || blob.name || 'artwork';
  d0.file = blob; d0.fileName = name; d0.uploadFailed = false;
  function attempt(n){
    var fd = new FormData(); fd.append('file', blob, name);
    return fetch(CONFIG.artEndpoint.replace(/\/+$/,'') + '/upload', {method:'POST', body:fd})
      .then(function(r){ if(r.ok) return r.json(); throw new Error('upload ' + r.status); })
      .then(function(j){ if(!j || !j.url) throw new Error('no url'); return j; })
      .catch(function(e){ if(n >= 3) throw e; return new Promise(function(res){ setTimeout(res, n * 1500); }).then(function(){ return attempt(n + 1); }); });
  }
  d0.upP = attempt(1)
    .then(function(j){ d0.url = j.url; d0.key = j.key || ''; d0.uploadFailed = false; if(S.art[k] === d0 && !S.saving) render(); })
    .catch(function(e){ if(window.console) console.error('[Alive artwork] upload failed', e);
      d0.uploadFailed = true; if(S.art[k] === d0 && !S.saving) render(); });
  return d0.upP;
}
function pendingUploads(){
  if(S.mode === 'later') return [];
  return S.locs.filter(function(k){ var d = S.art[k]; return d && !d.url && d.file; });
}
var BG_MSG = {_default:'We could not lift the background off this one. Send it as is and our art team will sort it.',
  no_bg:'This one already has a clear background.', too_complex:'Too much going on in the background for an automatic cut-out. Our art team will do it by hand.'};
function removeBg(k){
  var d = S.art[k]; if(!d || d.bgBusy || d.bgRemoved || !d.src) return;
  d.bgBusy = true; d.bgMsg = ''; render();
  setTimeout(function(){
    var im = new Image();
    im.onload = function(){
      var r; try{ r = AliveBgRemove.run(im); }catch(e){ r = {ok:false}; }
      d.bgBusy = false;
      if(!r || !r.ok){ d.bgMsg = BG_MSG[r && r.reason] || BG_MSG._default; render(); return; }
      d.bgPrev = {src:d.src, thumb:d.thumb, colors:d.colors, photoish:d.photoish, ink:S.inks[k]};
      d.src = r.dataUrl; d.bgRemoved = true;
      var im2 = new Image();
      im2.onload = function(){ var det = {ok:false}; try{ det = AliveArtColors.detect(im2); }catch(e){}
        if(det.ok){ d.colors = det.colors || []; d.photoish = !!det.photoish; if(det.count && !det.photoish) S.inks[k] = Math.min(E.MAX_INK, det.count); }
        d.thumb = thumbFrom(im2); render(); };
      im2.src = r.dataUrl;
    };
    im.onerror = function(){ d.bgBusy = false; d.bgMsg = BG_MSG._default; render(); };
    im.src = d.src;
  }, 30);
}
function undoBg(k){
  var d = S.art[k]; if(!d || !d.bgPrev) return;
  d.src = d.bgPrev.src; d.thumb = d.bgPrev.thumb; d.colors = d.bgPrev.colors; d.photoish = d.bgPrev.photoish;
  if(d.bgPrev.ink) S.inks[k] = d.bgPrev.ink;
  d.bgRemoved = false; d.bgPrev = null; d.bgMsg = ''; render();
}

/* "Send my design later": ask for the ink colors so the price is real. */
function laterPrompt(){
  var spLocs = S.locs.filter(needsInkCount);
  if(!spLocs.length) return;
  var rows = spLocs.map(function(k){
    var v = S.inks[k] || 1, o = '';
    for(var i = 1; i <= (S.p._drinkware ? 4 : E.MAX_INK); i++) o += '<option value="' + i + '"' + (i === v ? ' selected' : '') + '>' + i + ' color' + (i > 1 ? 's' : '') + '</option>';
    return '<label class="lp-row"><span>' + esc(LOC[k].label) + '</span><select data-lpink="' + k + '">' + o + '</select></label>';
  }).join('');
  var box = openBox('<div class="tb" role="dialog" aria-modal="true"><h4>How many colors are in your design?</h4>' +
    '<p>Screen printing is priced by ink colors. Pick your best guess — the shirt color doesn’t count.</p>' + rows +
    '<p class="lp-note">We confirm it on your proof. If it’s different, the price may change and we’ll check with you before anything prints.</p>' +
    '<button type="button" class="x lp-ok">Use these colors</button></div>', 'tipbox');
  box.querySelectorAll('[data-lpink]').forEach(function(s){ s.onchange = function(){ S.inks[s.dataset.lpink] = +s.value; }; });
  box.querySelector('.lp-ok').addEventListener('click', function(){
    box.querySelectorAll('[data-lpink]').forEach(function(s){ S.inks[s.dataset.lpink] = +s.value; });
    render();
  });
}

/* ------------------------------------------------------------ render */
function render(){
  var c = S.colors[S.color];
  var html = '';
  if(S.phase === 'artwork'){
    html = stepper(2) +
      '<div class="wrap"><div class="shell solo">' +
        '<div>' + productCard(overlay(), '', tools()) +
          methodTabs() + locPills() +
          '<div class="sec-lbl">Your design' + tip('artwork,colors') + '</div>' + modePicker() +
          '<div class="lcards">' + S.locs.map(locCard).join('') + '</div>' +
          (S.err ? '<div class="warn">' + esc(S.err) + '</div>' : '') +
          '<div class="undercta">' + artNote() + '</div>' +
          '<button class="backlink" type="button" data-goto="sizes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Back to color &amp; sizes</button>' +
          '<div class="mhelp">' + helpBar() + '</div>' +
        '</div>' +
      '</div></div>' +
      mbar(S.saving ? 'Uploading your artwork&hellip;' : 'Continue to checkout &rarr;', S.saving || !artReady(), barSub());
  }else{
    var foot = S.phase === 'color' ? colorFoot() : sizeFoot();
    html = stepper(1) +
      '<div class="wrap"><a class="allprod" href="' + esc(productsUrl()) + '" data-allprod="1">&larr; All products</a>' +
      '<div class="shell solo"><div>' + productCard('', foot, '') + mediaStrip(c) + whyAlive() +
        '<div class="mhelp">' + helpBar() + '</div></div></div></div>' +
      mbar(S.phase === 'color' ? 'Continue to sizes &rarr;' : 'Continue to artwork &rarr;',
           S.phase === 'sizes' && !sizesReady(), barSub());
  }
  root.innerHTML = html;
  wire();
  placeBar();
  broadcast();
}

function refreshPrice(){
  /* in-place so typing in a size box keeps the caret */
  var mv = document.getElementById('mb-v'), ms = document.getElementById('mb-s');
  var u = unitNow();
  if(mv) mv.textContent = u == null ? 'Min ' + minQ() + ' pcs' : money(u);
  if(ms) ms.textContent = barSub();
  pushBar();
  var a = sizeTotal(), tot = root.querySelector('.sztot');
  if(tot && !isOneSize()){ tot.querySelector('b').textContent = a + ' pcs'; tot.classList.toggle('ok', a >= minQ()); tot.classList.toggle('off', a > 0 && a < minQ()); }
  root.querySelectorAll('[data-size]').forEach(function(inp){
    var up = E.sizeUpchargePer(S.p, inp.dataset.size, pricingCfg());
    var u2 = inp.parentNode.querySelector('u'); if(u2) u2.textContent = up ? '+' + money(up) : '';
  });
  var mc = root.querySelector('[data-mcta]');
  if(mc && S.phase === 'sizes') mc.disabled = !sizesReady();
}

function go(phase, scroll){
  S.phase = phase; S.gal = null;
  if(phase === 'artwork'){ S.side = 'front'; ensureFrame(); }
  render();
  if(scroll === 'foot') scrollToEl(root.querySelector('.pcard-foot'));
  else scrollToEl(root.querySelector('.steps'));
}

/* The editor's photo box must match the photo's real shape, or placed
   artwork drifts off the garment. Measure it once per color. */
function ensureFrame(){
  var c = S.colors[S.color]; if(!c || S.frame[S.color]) return;
  var i = new Image(), idx = S.color;
  i.onload = function(){ if(i.naturalWidth && i.naturalHeight){ S.frame[idx] = +(i.naturalWidth / i.naturalHeight).toFixed(4); if(S.phase === 'artwork') render(); } };
  i.src = colorFront(c);
}

function wire(){
  root.querySelectorAll('[data-color]').forEach(function(b){
    b.onclick = function(){ S.color = +b.dataset.color; S.side = 'front'; S.gal = null; ensureFrame(); render(); };
  });
  root.querySelectorAll('[data-side]').forEach(function(b){ b.onclick = function(){ S.side = b.dataset.side; S.gal = null; render(); }; });
  root.querySelectorAll('[data-phase]').forEach(function(b){ b.onclick = function(){ go(b.dataset.phase, 'foot'); }; });
  root.querySelectorAll('[data-goto]').forEach(function(b){ b.onclick = function(){ go(b.dataset.goto, b.dataset.goto === 'sizes' ? 'foot' : null); }; });
  root.querySelectorAll('[data-size]').forEach(function(inp){
    inp.oninput = function(){
      var v = inp.value.replace(/\D/g,'').slice(0,5); if(inp.value !== v) inp.value = v;
      var n = parseInt(v,10) || 0; if(n) S.sizes[inp.dataset.size] = n; else delete S.sizes[inp.dataset.size];
      inp.parentNode.classList.toggle('has', !!n); refreshPrice();
    };
  });
  root.querySelectorAll('[data-q]').forEach(function(b){
    b.onclick = function(){ var st = S.qty < 100 ? 6 : (S.qty < 500 ? 12 : 50);
      S.qty = b.dataset.q === '+' ? S.qty + st : Math.max(minQ(), S.qty - st); render(); };
  });
  var qi = document.getElementById('f-qty');
  if(qi){ qi.oninput = function(){ var v = qi.value.replace(/\D/g,'').slice(0,5); if(qi.value !== v) qi.value = v; };
          qi.onchange = qi.onblur = function(){ S.qty = Math.max(minQ(), parseInt(qi.value,10) || minQ()); render(); }; }
  wireStrip();
  root.querySelectorAll('[data-method]').forEach(function(b){ b.onclick = function(){ setMethod(b.dataset.method); render(); }; });
  root.querySelectorAll('[data-loc]').forEach(function(b){
    b.onclick = function(){ var k = b.dataset.loc, i = S.locs.indexOf(k);
      if(i > -1){ if(S.locs.length > 1){ S.locs.splice(i,1); delete S.art[k]; } }
      else { S.locs.push(k); if(S.mode === 'later' && needsInkCount(k)) setTimeout(laterPrompt, 0); }
      render(); };
  });
  root.querySelectorAll('[data-ink]').forEach(function(s){ s.onchange = function(){ S.inks[s.dataset.ink] = +s.value; refreshPrice(); }; });
  root.querySelectorAll('[data-mode]').forEach(function(b){
    b.onclick = function(){ var was = S.mode; S.mode = b.dataset.mode; render(); if(S.mode === 'later' && was !== 'later') laterPrompt(); };
  });
  root.querySelectorAll('[data-add]').forEach(function(b){ b.onclick = function(){ pickFile(b.dataset.add); }; });
  root.querySelectorAll('[data-del]').forEach(function(b){ b.onclick = function(){ delete S.art[b.dataset.del]; if(S.sel === b.dataset.del) S.sel = null; render(); }; });
  root.querySelectorAll('[data-bg]').forEach(function(b){ b.onclick = function(){ removeBg(b.dataset.bg); }; });
  root.querySelectorAll('[data-undobg]').forEach(function(b){ b.onclick = function(){ undoBg(b.dataset.undobg); }; });
  root.querySelectorAll('[data-card]').forEach(function(el){
    el.addEventListener('click', function(e){ if(e.target.closest('button,select,label')) return;
      var k = el.dataset.card; S.sel = k; if(LOC[k] && LOC[k].side){ S.side = LOC[k].side; S.gal = null; } render(); });
  });
  root.querySelectorAll('.layer').forEach(function(el){
    el.addEventListener('pointerdown', function(e){
      var k = el.getAttribute('data-layer'), h = e.target.getAttribute && e.target.getAttribute('data-h');
      S.sel = k;
      if(h === 'del'){ e.preventDefault(); e.stopPropagation(); delete S.art[k]; S.sel = null; render(); return; }
      startDrag(e, k, h || 'move');
    });
  });
  root.querySelectorAll('[data-tool]').forEach(function(b){
    b.onclick = function(){ var k = toolTarget(), d = k && S.art[k]; if(!d) return;
      if(b.dataset.tool === 'center'){ d.place.cx = 0.5; d.place.rot = 0; }
      else if(b.dataset.tool === 'zoomin') d.place.w = Math.min(1.6, d.place.w * 1.12);
      else d.place.w = Math.max(0.03, d.place.w / 1.12);
      applyLayerStyle(k); };
  });
  var mc = root.querySelector('[data-mcta]');
  if(mc) mc.onclick = function(){
    if(S.phase === 'color') go('sizes', 'foot');
    else if(S.phase === 'sizes'){ if(sizesReady()) go('artwork'); }
    else if(artReady()) addToCart();
  };
  var ap = root.querySelector('[data-allprod]');
  if(ap) ap.onclick = function(e){ e.preventDefault(); nav(productsUrl()); };
}
/* Deselect when tapping outside the design. */
root.addEventListener('pointerdown', function(e){
  if(S.phase !== 'artwork' || S.sel === null) return;
  if(e.target.closest && e.target.closest('.layer, .tools, .lcard')) return;
  S.sel = null;
  root.querySelectorAll('.layer.sel').forEach(function(el){ el.classList.remove('sel'); });
});

/* ------------------------------------------------------------ cart */
var CART = {
  K_ITEMS:'alive_cart_items_v1', K_PROMO:'alive_cart_promo_v1',
  _p:function(raw,fb){try{return raw?JSON.parse(raw):fb;}catch(e){return fb;}},
  getItems:function(){try{return this._p(localStorage.getItem(this.K_ITEMS),[]);}catch(e){return [];}},
  getPromo:function(){try{return this._p(localStorage.getItem(this.K_PROMO),null);}catch(e){return null;}},
  addItem:function(item){
    var items = this.getItems();
    item.id = 'ci_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7);
    item.addedAt = new Date().toISOString();
    items.push(item);
    try{ localStorage.setItem(this.K_ITEMS, JSON.stringify(items)); }catch(e){ return null; }
    return item;
  }
};
/* Just the fields the pricing engine needs, so checkout can re-price when
   rush / add-ons change without loading the 17 MB catalog again. */
function pricingProduct(){
  var p = S.p, keep = {};
  ['style','name','brand','category','case_price','case_sale_price','size_upcharges','available_sizes',
   '_dealBasicTee','_drinkware','_dwMatrix','_blank'].forEach(function(k){ if(p[k] !== undefined) keep[k] = p[k]; });
  return keep;
}
function addToCart(){
  if(S.saving) return;
  var pend = pendingUploads();
  if(pend.length){
    S.saving = true; render();
    pend.forEach(function(k){ var d = S.art[k]; if(d.uploadFailed || !d.upP) upload(k, d.file, d.fileName); });
    var all = Promise.all(pend.map(function(k){ return S.art[k].upP; }));
    var cap = new Promise(function(res){ setTimeout(res, 120000); });
    Promise.race([all, cap]).then(function(){ S.saving = false; addToCartNow(); });
    return;
  }
  addToCartNow();
}
function addToCartNow(){
  var q = realQty(), cfg = pricingCfg(q), sizes = isOneSize() ? sizesForTotal() : JSON.parse(JSON.stringify(S.sizes));
  var pp = E.unitPrice(S.p, cfg);
  if(pp == null){ S.err = 'Minimum order is ' + minQ() + ' pieces.'; render(); return; }
  var c = S.colors[S.color] || {};
  var files = [], byLoc = {};
  S.locs.forEach(function(k){
    var d = S.art[k]; if(!d) return;
    var f = {location:LOC[k].label, name:d.name, url:d.url || ''};
    if(!d.url) f.pending = true;            /* checkout flags files that never reached storage */
    files.push(f); byLoc[LOC[k].label] = f;
  });
  var placeNotes = S.locs.filter(function(k){ return S.art[k] && S.art[k].src && LOC[k].side; }).map(function(k){
    var p = S.art[k].place;
    return LOC[k].label + ' placed at ' + Math.round(p.cx*100) + '/' + Math.round(p.cy*100) + ', ' + Math.round(p.w*100) + '% width' + (Math.round(p.rot) ? ', rotated ' + Math.round(p.rot) + '°' : '');
  });
  var inkNotes = S.locs.map(function(k){
    return LOC[k].label + ': ' + (S.method === 'em' ? 'embroidery' : S.method === 'ht' ? 'full color' : needsInkCount(k) ? inkFor(k) + '-color print' : '1-color print');
  });
  var notes = [];
  if(S.mode === 'later') notes.push('ARTWORK TO FOLLOW — customer will email it.' + (S.method === 'sp' ? ' Ink colors are the customer’s estimate — confirm on the proof.' : ''));
  notes = notes.concat(inkNotes, placeNotes);
  var lm = {}; S.locs.forEach(function(k){ lm[k] = S.method; });
  var upTot = E.upchargeTotal(S.p, cfg, sizes);
  var perSize = {}; Object.keys(sizes).forEach(function(z){ var u = E.sizeUpchargePer(S.p, z, cfg); if(u > 0) perSize[z] = u; });
  var promo = CART.getPromo();
  var item = {
    style: S.p.style, productName: cleanName(S.p), brand: S.p.brand || '', color: c.name || '',
    productImage: colorFront(c),
    decoMethod: E.orderMethod(S.p, cfg), decoLabel: E.methodLabel(S.method),
    locMethod: lm, locations: S.locs.slice(),
    frontColors: (lm.front === 'sp' || (S.p._drinkware && lm.front)) ? inkFor('front') : null,
    backColors: lm.back === 'sp' ? inkFor('back') : null,
    qty: q, sizes: sizes,
    addons: {neck:false, hem:false, bag:false}, addonList: [], rush: 'std',
    turnaroundLabel: 'Standard (10 business days)',
    artworkLink: S.mode === 'later' ? 'Customer will email artwork after checkout.' : files.filter(function(f){ return f.url; }).map(function(f){ return f.location + ': ' + f.url; }).join('\n'),
    artworkFiles: files, artworkByLocation: byLoc,
    artworkNote: files.filter(function(f){ return f.url; }).map(function(f){ return f.location + ': ' + f.url; }).join(', '),
    artworkLater: S.mode === 'later',
    notes: notes.join(' · '),
    unitPrice: pp, sizeUpchargeTotal: upTot, sizeUpchargePerSize: perSize,
    lineTotal: E.lineTotal(S.p, cfg, sizes),
    promoCodeAtAdd: promo && promo.code ? promo.code : '', promoDiscountAtAdd: S.promo || 0,
    pricingProduct: pricingProduct(), source: 'product-page-v3'
  };
  if(!CART.addItem(item)){ S.err = 'We could not save your order in this browser. Please call ' + CONFIG.phone + '.'; render(); return; }
  nav(cartUrl());
}

/* ------------------------------------------------------------ boot */
function fail(msg){
  root.innerHTML = '<div class="loading">' + msg + '<br><br><a href="' + CONFIG.phoneHref + '">Call us on ' + esc(CONFIG.phone) + '</a> and we will quote it for you.<br><br>' +
    '<a href="' + esc(productsUrl()) + '" data-allprod="1">&larr; Browse all products</a></div>';
  var ap = root.querySelector('[data-allprod]'); if(ap) ap.onclick = function(e){ e.preventDefault(); nav(productsUrl()); };
  broadcast();
}
function boot(data){
  var want = String(qp('style') || '').trim().toUpperCase();
  if(!want) return fail('Pick a product to get started.');
  var rows = Array.isArray(data) ? data : (data.products || []), raw = null, manual = false;
  for(var i = 0; i < rows.length; i++){ if(String(rows[i].style).toUpperCase() === want){ raw = rows[i]; break; } }
  if(!raw){ (window.MANUAL_PRODUCTS || []).forEach(function(m){ if(String(m.style).toUpperCase() === want){ raw = m; manual = true; } }); }
  if(window.buildHexLookup) buildHexLookup(rows);
  var p = raw && E.prepare(raw, manual);
  if(!p) return fail('We could not find that product just now.');
  S.raw = raw; S.p = p;
  S.colors = sortColors((p.colors || []).filter(function(c){ return c && c.images && colorFront(c); }));
  if(!S.colors.length) return fail('We could not load photos for this product.');
  var wc = qp('color');
  if(wc) S.colors.forEach(function(c, j){ if(c.name.toLowerCase() === wc.toLowerCase()) S.color = j; });
  var promo = CART.getPromo();
  if(promo && promo.code && E.PROMO_CODES[promo.code]) S.promo = E.PROMO_CODES[promo.code];
  setMethod(E.decoMethods(p)[0]);
  if(E.isEmbroideryOnly(p)) setMethod('em');
  S.est = Math.max(CONFIG.defaultEstimate, E.minQty(p, pricingCfg(CONFIG.defaultEstimate)));
  if(isOneSize()) S.qty = S.est;
  var ph = qp('step');
  S.phase = ph === 'sizes' ? 'sizes' : 'color';
  subscribeViewport();
  ensureFrame();
  render();
}
var CROPS = {};
var cropsP = fetch(CONFIG.cropsJson).then(function(r){ return r.ok ? r.json() : {}; }).then(function(j){ CROPS = j || {}; }).catch(function(){});
fetch(CONFIG.productsJson)
  .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(function(data){ return cropsP.then(function(){ return data; }); })
  .then(boot)
  .catch(function(err){ if(window.console) console.error('[Alive product]', err); fail('We could not load this product just now.'); });

/* test hook */
window.__ALIVE_PRODUCT__ = {S:S, render:render, addToCart:addToCart, go:go};
})();

</script>
</body>
