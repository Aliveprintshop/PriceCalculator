/* =====================================================================
   ALIVE PRINT SHOP — STEP 4 OF 4, CHECKOUT
   Single-file embed, scoped to #alive-flow like the rest of the flow.

   This takes NO payment. Alive quotes, proofs, then invoices, so this
   collects details and submits an order request. If card payment is added
   later it belongs after the proof is approved, not here — see
   claude/tech-notes-stripe-checkout.md.
   ===================================================================== */
:root,#alive-flow{
  --bg:#f2f4f7;--surface:#fff;--surface2:#f7f8fa;
  --border:#e2e6eb;--border2:#c8cdd5;
  --text:#0f1117;--text2:#4b5563;--text3:#9ca3af;
  --blue:#1b6cce;--blue-light:#eef4fc;--blue-mid:#a8c8f0;--blue-dark:#1558a8;
  --green:#16a34a;--green-light:#f0fdf4;
  --amber:#b45309;--amber-light:#fffbeb;
  --ink:#0f1117;--r:8px;--r-lg:14px;--r-xl:20px;
  --disp:'Montserrat',sans-serif;--body:'Open Sans',sans-serif;
}
#alive-flow,#alive-flow *{box-sizing:border-box;margin:0;padding:0;}
#alive-flow{font-family:var(--body);background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;display:block;}
#alive-flow img{max-width:100%;display:block;}
#alive-flow button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
#alive-flow a{color:var(--blue);}
#alive-flow h1,#alive-flow h2,#alive-flow h3,#alive-flow h4{font-family:var(--disp);line-height:1.14;letter-spacing:-.01em;}
#alive-flow :focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:4px;}
#alive-flow .num{font-variant-numeric:tabular-nums;}
#alive-flow .wrap{max-width:1120px;margin:0 auto;padding-inline:18px;}
#alive-flow .narrow{max-width:860px;margin:0 auto;}
#alive-flow .cta{display:block;width:100%;background:var(--blue);color:#fff;border-radius:var(--r-lg);
  padding:16px 20px;font-family:var(--disp);font-size:15px;font-weight:800;letter-spacing:.04em;
  text-transform:uppercase;text-align:center;text-decoration:none;}
#alive-flow .cta:hover{background:var(--blue-dark);}
#alive-flow .cta:disabled{background:var(--border2);cursor:not-allowed;}
/* ---- 4-step progress bar (shared by all four steps) ----------------- */
#alive-flow .steps{background:var(--surface);border-bottom:1px solid var(--border);}
#alive-flow .steps-in{max-width:720px;margin:0 auto;padding:18px 16px 16px;
  display:flex;align-items:flex-start;justify-content:center;}
#alive-flow .stp{display:flex;flex-direction:column;align-items:center;gap:7px;
  flex:0 0 auto;width:92px;text-decoration:none;background:none;border:0;padding:0;}
#alive-flow .stp .dot{width:30px;height:30px;border-radius:50%;background:var(--border2);color:#fff;
  display:grid;place-items:center;font-family:var(--disp);font-size:13px;font-weight:800;
  transition:background .15s,box-shadow .15s;}
#alive-flow .stp .nm{font-family:var(--disp);font-size:11.5px;font-weight:700;color:var(--text3);
  text-align:center;line-height:1.25;}
#alive-flow .stp.done .dot{background:var(--ink);}
#alive-flow .stp.done .nm{color:var(--text2);}
#alive-flow .stp.done{cursor:pointer;}
#alive-flow .stp.done:hover .dot{background:var(--blue-dark);}
#alive-flow .stp.done:hover .nm{color:var(--blue);}
#alive-flow .stp.now .dot{background:var(--blue);box-shadow:0 0 0 4px var(--blue-light);}
#alive-flow .stp.now .nm{color:var(--blue);}
#alive-flow .stp .dot svg{width:15px;height:15px;}
#alive-flow .rule{flex:1 1 auto;height:2px;background:var(--border);margin-top:14px;
  max-width:74px;min-width:8px;border-radius:2px;}
#alive-flow .rule.done{background:var(--ink);}
/* Four steps do not fit a small phone at full width. */
@media(max-width:440px){
  #alive-flow .stp{width:auto;flex:1 1 0;min-width:0;}
  #alive-flow .stp .nm{font-size:10px;}
  #alive-flow .steps-in{padding:14px 10px 12px;}
}
/* ---- help + price-break nudge (every step) --------------------------- */
#alive-flow .help{border-top:1px solid var(--border);padding-top:14px;display:grid;gap:7px;}
#alive-flow .help .cap{margin-bottom:0;}
#alive-flow .help a{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text2);
  text-decoration:none;padding:7px 9px;border-radius:var(--r);border:1px solid var(--border);
  background:var(--surface2);}
#alive-flow .help a:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-light);}
#alive-flow .help a svg{width:16px;height:16px;flex:none;color:var(--blue);}
#alive-flow .help a b{font-weight:700;color:var(--text);}

#alive-flow .nudge{display:flex;gap:9px;align-items:flex-start;background:var(--green-light);
  border:1px solid #bbf7d0;border-radius:var(--r);padding:9px 11px;font-size:12px;color:#15803d;
  line-height:1.5;}
#alive-flow .nudge svg{width:15px;height:15px;flex:none;margin-top:1px;}
#alive-flow .nudge b{font-weight:800;}
#alive-flow .nudge button{font-weight:800;text-decoration:underline;color:inherit;font-size:12px;}
/* ---- layout ---------------------------------------------------------- */
#alive-flow{padding-bottom:104px;}

#alive-flow .hd{margin-bottom:14px;}
#alive-flow .hd h1{font-size:clamp(25px,4.4vw,33px);font-weight:800;text-transform:uppercase;}
#alive-flow .hd h2{font-size:17px;font-weight:800;text-transform:uppercase;}
#alive-flow .hd p{color:var(--text2);font-size:13.5px;margin-top:6px;}

/* ---- cart items ------------------------------------------------------ */
#alive-flow .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:18px;margin-bottom:18px;}

/* ---- form ------------------------------------------------------------ */

  border:1.5px solid var(--border2);border-radius:var(--r);font:inherit;background:var(--surface);color:var(--text);}

/* ---- delivery pick --------------------------------------------------- */

#alive-flow .reup em{display:block;font-style:normal;font-size:12px;color:#b45309;margin-top:2px;}
#alive-flow .reup-btn{flex:none;background:var(--blue);color:#fff;border:0;border-radius:var(--r);padding:10px 14px;
  font-family:var(--disp);font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;}
#alive-flow .reup-btn:disabled{background:var(--border2);cursor:default;}

  #alive-flow .morder{display:block;}

}

<body>
<div id="alive-flow"><div class="loading">Loading&hellip;</div></div>
<script>
/* =====================================================================
   ALIVE PRICING ENGINE — DOM-free port of alive-pricing-calculator-v2.html
   ---------------------------------------------------------------------
   Every number here is copied from v2, which is what the alive-checkout
   Worker's pricing-core recomputes and charges. If v2 changes, change this
   and re-run test_engine_parity.js (must stay 100% exact).

   Usage:
     var prod = AliveEngine.prepare(rawProductFromProductsJson);
     var cfg  = { qty, locs:['front','back'], locMethod:{front:'sp',back:'sp'},
                  frontColors:3, backColors:1,
                  addons:{neck,hem,bag}, rush:'std'|'rush'|'super',
                  promoDiscount:0 };
     AliveEngine.unitPrice(prod, cfg)          -> per-piece price or null
     AliveEngine.sizeUpchargePer(prod, sz, cfg)-> extra per piece for 2XL+
     AliveEngine.lineTotal(prod, cfg, sizes)   -> order line total
   ===================================================================== */
(function(root){
'use strict';

var FRONT={24:[6.55,7.05,8.05,8.55,9.05,10.05,11.55,12.05],36:[3.55,4.05,5.05,5.55,6.05,7.05,8.55,9.05],50:[3.15,3.55,4.20,5.10,5.75,6.40,7.05,7.70],72:[2.75,3.10,3.65,4.25,4.54,5.40,5.90,6.40],144:[2.60,2.75,3.40,3.75,4.15,4.50,4.90,5.30],300:[2.35,2.45,3.05,3.40,3.75,4.10,4.45,4.80],500:[2.05,2.25,2.70,3.00,3.30,3.60,3.90,4.20],1000:[1.90,2.20,2.50,2.80,3.10,3.40,3.70,4.00],2500:[1.85,2.10,2.40,2.70,3.00,3.30,3.60,3.90],5000:[1.80,1.95,2.10,2.30,2.65,3.05,3.35,3.55]};
var BACK={24:[6.19,6.64,7.54,7.99,8.44,9.34,10.69,11.14],36:[3.19,3.64,4.54,4.99,5.44,6.34,7.69,8.14],50:[2.83,3.19,3.78,4.59,5.17,5.76,6.34,6.93],72:[2.47,2.79,3.28,3.82,4.08,4.86,5.31,5.76],144:[2.34,2.47,3.06,3.37,3.73,4.05,4.41,4.77],300:[2.11,2.20,2.74,3.06,3.37,3.69,4.00,4.32],500:[1.84,2.02,2.43,2.70,2.97,3.24,3.51,3.78],1000:[1.71,1.98,2.25,2.52,2.79,3.06,3.33,3.60],2500:[1.66,1.89,2.16,2.43,2.70,2.97,3.24,3.51],5000:[1.62,1.75,1.80,2.07,2.38,2.74,3.01,3.19]};
var HEMTAG=[[25,6.89],[50,3.75],[100,3.30],[300,2.09],[500,1.62],[1000,1.36],[2000,1.20]];
var QB=[24,36,50,72,144,300,500,1000,2500,5000];
var EM_QB=[12,24,36,72,144,300,500];
var EM_FRONT={12:12.50,24:7.50,36:6.00,72:5.25,144:5.00,300:4.85,500:4.65};
var EM_SIDE ={12: 6.95,24:5.95,36:4.45,72:4.25,144:3.95,300:3.45,500:3.25};
var EM_SETUP_FEE=45.00, EM_MIN_QTY=12;
var HT_BREAKS=[[10,12.75],[20,8.00],[50,5.41],[100,4.95],[200,4.33],[300,4.15],[500,4.11],[1000,4.08],[2500,4.03],[5000,4.00]];
var HT_SMALL_BREAKS=[[10,12.75],[20,6.00],[50,5.00],[100,4.95],[200,4.33],[300,4.15],[500,4.11],[1000,4.08],[2500,4.03],[5000,4.00]];
var FOAM_TRUCKER_STYLES={'C936':1,'C993':1,'OG605':1,'NE410':1,'C950':1,'DT624':1,'NE212':1};
var SLEEVE_SP=1.50, ADDON_NECK=0.75, ADDON_BAG=0.85;
var RUSH_MULT={std:1, rush:1.15, super:1.25};
var RUSH_DAYS={std:10, rush:7, super:5}, HEM_EXTRA_DAYS=5;
var PROMO_CODES={'SAMPLE50':0.5,'SAMPLE80':0.8};

var _EXT={'2XL':1,'3XL':1,'4XL':1,'5XL':1,'6XL':1,'7XL':1,'8XL':1,'XXL':1,'XXXL':1,'XXXXL':1,'XXXXXL':1};
function isExtendedSize(sz){return !!_EXT[String(sz||'').trim().toUpperCase()];}

var BASIC_TEE_DEAL_STYLES={};   /* Basic Tee Deal OFF since 2026-09-25 (Austin): normal pricing on 5000/5000B */
var BASIC_TEE_DEAL_COST_BASE=2.30;
var BASIC_TEE_DEAL_COST_BYSIZE={'2XL':3.89,'3XL':5.09,'4XL':5.09,'5XL':5.09};
var HOODIE_DEAL_STYLES={}, HOODIE_DEAL_MIN_QTY=50;   /* 18500 deal OFF since 2026-09-24 — matches v2 and the Worker */
var HOODIE_DEAL_COST_BASE=9.1467;
var HOODIE_DEAL_COST_BYSIZE={'2XL':10.6334,'3XL':12.0200,'4XL':12.0200,'5XL':12.0200};
var CALC_EXCLUDE_STYLES={'LACE':1};

function pick(br,q){var r=br[0][1];for(var i=0;i<br.length;i++){if(q>=br[i][0])r=br[i][1];}return r;}
function getQB(q){for(var i=QB.length-1;i>=0;i--){if(q>=QB[i])return QB[i];}return 24;}
function getEMQB(q){var r=EM_QB[0];for(var i=0;i<EM_QB.length;i++){if(q>=EM_QB[i])r=EM_QB[i];}return r;}
function getHem(q){return pick(HEMTAG,q);}
function r2(n){return parseFloat((+n).toFixed(2));}

/* ---- product preparation (same as v2 loadProducts) ------------------- */
function normalizeProductUpcharges(p){
  var su=p.size_upcharges;
  if(!su||typeof su!=='object')return;
  var stdUp=Infinity;
  Object.keys(su).forEach(function(sz){if(!isExtendedSize(sz)){var v=parseFloat(su[sz]);if(!isNaN(v)&&v<stdUp)stdUp=v;}});
  if(!isFinite(stdUp)||stdUp<0)stdUp=0;
  if(stdUp>0){
    if(p.case_price!=null&&!isNaN(p.case_price))p.case_price=parseFloat((p.case_price+stdUp).toFixed(2));
    if(p.case_sale_price!=null&&!isNaN(p.case_sale_price))p.case_sale_price=parseFloat((p.case_sale_price+stdUp).toFixed(2));
  }
  var clean={};
  Object.keys(su).forEach(function(sz){
    if(!isExtendedSize(sz))return;
    var v=parseFloat(su[sz]);if(isNaN(v))return;
    var net=parseFloat((v-stdUp).toFixed(2));if(net>0)clean[sz]=net;
  });
  p.size_upcharges=clean;
}
function applyBasicTeeDeal(p){
  if(!p||!p.style)return;
  if(!BASIC_TEE_DEAL_STYLES[String(p.style).trim().toUpperCase()])return;
  p._dealBasicTee=true;
  p.case_price=BASIC_TEE_DEAL_COST_BASE;
  p.case_sale_price=null;
  var up={};
  Object.keys(BASIC_TEE_DEAL_COST_BYSIZE).forEach(function(sz){
    var d=parseFloat((BASIC_TEE_DEAL_COST_BYSIZE[sz]-BASIC_TEE_DEAL_COST_BASE).toFixed(2));if(d>0)up[sz]=d;});
  p.size_upcharges=up;
}
function dwFromPrice(p){
  if(!p||!p._dwMatrix)return null;var lo=null;
  for(var qb in p._dwMatrix){var row=p._dwMatrix[qb];for(var c in row){var v=row[c];if(lo===null||v<lo)lo=v;}}
  return lo;
}
/* Returns a prepared product, or null when v2 would not list it. Manual
   products (drinkware) are passed with manual=true: v2 does not normalise them. */
function prepare(raw, manual){
  if(!raw||!raw.style)return null;
  var p=JSON.parse(JSON.stringify(raw));
  if(manual){ p._blank = p._drinkware ? dwFromPrice(p) : (p.p||null); return p; }
  if(p.discontinued===true)return null;
  if(CALC_EXCLUDE_STYLES[String(p.style).toUpperCase()])return null;
  normalizeProductUpcharges(p);
  applyBasicTeeDeal(p);
  var base=(p.case_sale_price!=null)?p.case_sale_price:p.case_price;
  if(base==null||isNaN(base))return null;
  p._blank=+(base*1.5).toFixed(2);
  return p;
}

/* ---- product type, methods, locations -------------------------------- */
function productType(p){
  if(!p)return 'other';
  if(p._drinkware)return 'drinkware';
  var cat=String(p.category||'').toLowerCase(), name=String(p.name||'').toLowerCase();
  if(cat.indexOf('cap')>-1){
    if(/(\bbeanie\b|\bknit\s*cap\b|\bknit\s*hat\b|\bknit\s*beanie\b)/.test(name))return 'beanie';
    return 'hat';
  }
  if(cat.indexOf('bag')>-1)return 'bag';
  if(cat.indexOf('outerwear')>-1)return 'jacket';
  if(cat.indexOf('polo')>-1||cat.indexOf('knit')>-1||cat.indexOf('woven')>-1)return 'polo';
  if(cat.indexOf('sweatshirt')>-1||cat.indexOf('fleece')>-1)return 'sweatshirt';
  if(cat.indexOf('bottom')>-1)return 'bottom';
  if(cat==='t-shirts'||cat==='activewear'||cat==='workwear'||cat==='personal protection'||cat==="women's"||cat==='youth'||cat==='infant & toddler'||cat==='tall'||cat==='accessories')return 'tshirt';
  return 'other';
}
function isFoamTrucker(p){return !!FOAM_TRUCKER_STYLES[String((p&&p.style)||'').toUpperCase()];}
function decoMethods(p){
  switch(productType(p)){
    case 'tshirt':return ['sp','ht']; case 'sweatshirt':return ['sp','ht','em'];
    case 'polo':return ['em','ht']; case 'jacket':return ['em','ht'];
    case 'hat':return ['em','ht']; case 'beanie':return ['em'];
    case 'bag':return ['em','ht']; case 'bottom':return ['sp','ht'];
    case 'drinkware':return ['sp']; default:return ['sp','ht'];
  }
}
function locations(p, method){
  if(!p)return [];
  var pt=productType(p);
  if(pt==='drinkware')return [{key:'front',label:'Front'}];
  if(pt==='hat'&&isFoamTrucker(p))return [{key:'front',label:'Front',cls:'front'}];
  if(method==='em'){
    switch(pt){
      case 'hat':return [{key:'front',label:'Front',cls:'front'},{key:'back',label:'Back',cls:'side'},{key:'left-side',label:'Left Side',cls:'side'},{key:'right-side',label:'Right Side',cls:'side'}];
      case 'beanie':return [{key:'front',label:'Front',cls:'front'},{key:'back',label:'Back',cls:'side'}];
      case 'polo': case 'jacket':
        return [{key:'left-chest',label:'Left Chest',cls:'front'},{key:'right-chest',label:'Right Chest',cls:'front'},{key:'left-sleeve',label:'Left Sleeve',cls:'side'},{key:'right-sleeve',label:'Right Sleeve',cls:'side'}];
      case 'bag':return [{key:'front-center',label:'Front Center',cls:'front'}];
      case 'sweatshirt':return [{key:'front-center',label:'Front Center (8" max)',cls:'front'},{key:'left-sleeve',label:'Left Sleeve',cls:'side'},{key:'right-sleeve',label:'Right Sleeve',cls:'side'}];
      default:return [];
    }
  }
  return [{key:'front',label:'Front'},{key:'back',label:'Back'},{key:'left-sleeve',label:'Left Sleeve'},{key:'right-sleeve',label:'Right Sleeve'}];
}
function emLocCls(p,key){
  var list=locations(p,'em');
  for(var i=0;i<list.length;i++){if(list[i].key===key)return list[i].cls||'side';}
  return 'side';
}
function isEmbroideryOnly(p){
  if(!p||p._drinkware)return false;
  var a=decoMethods(p);return a.indexOf('sp')===-1&&a.indexOf('ht')===-1;
}
/* The order's representative method (drives the minimum and the deal rule). */
function orderMethod(p,cfg){
  if(p._drinkware)return 'sp';
  if(isEmbroideryOnly(p))return 'em';
  var sp=false,ht=false,em=false;
  (cfg.locs||[]).forEach(function(k){var m=(cfg.locMethod||{})[k]||'sp';if(m==='ht')ht=true;else if(m==='em')em=true;else sp=true;});
  if(em&&!sp&&!ht)return 'em';
  return (ht&&!sp)?'ht':'sp';
}
function dwBreaks(p){
  if(p&&p._dwMatrix){
    var ks=Object.keys(p._dwMatrix).map(function(k){return parseInt(k,10);}).filter(function(n){return !isNaN(n);});
    ks.sort(function(a,b){return a-b;});if(ks.length)return ks;
  }
  return [24,48,72,144];
}
function minQty(p,cfg){
  if(p._drinkware)return dwBreaks(p)[0];
  var m=orderMethod(p,cfg||{});
  if(m==='em')return EM_MIN_QTY;
  if(m==='ht')return 10;
  return 24;
}
function priceBreaks(p,cfg){
  if(p._drinkware)return dwBreaks(p);
  var m=orderMethod(p,cfg||{});
  if(m==='em')return EM_QB.filter(function(q){return q>=EM_MIN_QTY;});
  if(m==='ht')return HT_BREAKS.map(function(b){return b[0];});
  return QB.slice();
}

/* ---- pricing ------------------------------------------------------------ */
function hoodieDealOn(p,qty){return !!(p&&p.style&&HOODIE_DEAL_STYLES[String(p.style).trim().toUpperCase()])&&(qty||0)>=HOODIE_DEAL_MIN_QTY;}
function baseCostAt(p,qty){
  if(hoodieDealOn(p,qty))return HOODIE_DEAL_COST_BASE;
  var bp=(p.case_sale_price!=null)?p.case_sale_price:p.case_price;
  return (bp==null||isNaN(bp))?null:bp;
}
function blankUnit(p,qty,promo){
  var bp=baseCostAt(p,qty);
  var list=hoodieDealOn(p,qty)?parseFloat((bp*1.5).toFixed(2)):p._blank;
  if(!promo)return list;
  if(bp==null||isNaN(bp))return list;
  return parseFloat((bp+(bp*0.5*(1-promo))).toFixed(2));
}
function colorsIdx(n){var v=parseInt(n,10);if(!v||v<1)v=1;return v-1;}
function decoUnit(p,cfg,qty){
  var c=0,anyEM=false,qb=getQB(qty),htp=pick(HT_BREAKS,qty),hts=pick(HT_SMALL_BREAKS,qty),eqb=getEMQB(qty);
  var isHat=productType(p)==='hat';
  var deal=!!p._dealBasicTee&&orderMethod(p,cfg)==='sp'&&qty>=50;
  var fe=colorsIdx(cfg.frontColors), be=colorsIdx(cfg.backColors);
  if(deal&&fe>=0&&fe<=2)fe=0;
  if(deal&&be>=0&&be<=2)be=0;
  (cfg.locs||[]).forEach(function(key){
    var m=(cfg.locMethod||{})[key]||'sp';
    var isSleeve=(key==='left-sleeve'||key==='right-sleeve');
    var smallHT=(isHat||key==='left-chest'||key==='right-chest'||isSleeve);
    if(m==='em'){anyEM=true;c+=(emLocCls(p,key)==='front')?EM_FRONT[eqb]:EM_SIDE[eqb];}
    else if(m==='ht'){c+=smallHT?hts:htp;}
    else{
      if(key==='front')c+=(FRONT[qb]||FRONT[24])[fe];
      else if(key==='back')c+=(BACK[qb]||BACK[24])[be];
      else if(isSleeve)c+=SLEEVE_SP;
      else c+=(FRONT[qb]||FRONT[24])[fe];
    }
  });
  if(anyEM)c+=EM_SETUP_FEE/qty;
  return c;
}
function dwUnit(p,cfg,qty){
  if(!p._dwMatrix)return null;
  var b=dwBreaks(p),qb=b[0];for(var i=0;i<b.length;i++){if(qty>=b[i])qb=b[i];}
  var row=p._dwMatrix[qb]||p._dwMatrix[24];if(!row)return null;
  var c=parseInt(cfg.frontColors,10)||1;if(c<1)c=1;if(c>4)c=4;
  var v=row[c];return (v==null||isNaN(v))?null:parseFloat((+v).toFixed(2));
}
function unitPrice(p,cfg){
  var qty=cfg.qty|0;
  if(!p||qty<minQty(p,cfg))return null;
  if(p._drinkware)return dwUnit(p,cfg,qty);
  var c=blankUnit(p,qty,cfg.promoDiscount||0);
  c+=decoUnit(p,cfg,qty);
  var a=cfg.addons||{};
  if(a.neck)c+=ADDON_NECK;
  if(a.hem)c+=getHem(qty);
  if(a.bag)c+=ADDON_BAG;
  c*=(RUSH_MULT[cfg.rush]||1);
  return parseFloat(c.toFixed(2));
}
function sizeUpchargePer(p,sz,cfg){
  if(p._drinkware||!isExtendedSize(sz))return 0;
  var qty=cfg.qty|0, raw;
  if(hoodieDealOn(p,qty)){
    var dv=HOODIE_DEAL_COST_BYSIZE[String(sz).toUpperCase()];
    raw=(dv==null)?0:parseFloat((dv-HOODIE_DEAL_COST_BASE).toFixed(4));
  }else{
    var v=(p.size_upcharges||{})[sz];raw=(v==null||isNaN(v)||v<=0)?0:v;
  }
  if(!raw)return 0;
  var promo=cfg.promoDiscount||0;
  var mk=promo?(1+0.5*(1-promo)):1.5;
  return parseFloat((raw*mk*(RUSH_MULT[cfg.rush]||1)).toFixed(2));
}
function upchargeTotal(p,cfg,sizes){
  var t=0;Object.keys(sizes||{}).forEach(function(sz){var per=sizeUpchargePer(p,sz,cfg);if(per>0)t+=per*(sizes[sz]|0);});
  return parseFloat(t.toFixed(2));
}
function lineTotal(p,cfg,sizes){
  var pp=unitPrice(p,cfg);if(pp==null)return null;
  return parseFloat((pp*(cfg.qty|0)+upchargeTotal(p,cfg,sizes)).toFixed(2));
}
/* "Starting at" — v2's lowest price for the product: 1-color front at the top break. */
function turnaroundDays(rush,hem){return (RUSH_DAYS[rush]||10)+(hem?HEM_EXTRA_DAYS:0);}
function methodLabel(m){return m==='em'?'Embroidery':m==='ht'?'Full Color (heat transfer)':'Screen print';}

root.AliveEngine={
  prepare:prepare, productType:productType, decoMethods:decoMethods, locations:locations,
  isFoamTrucker:isFoamTrucker, isEmbroideryOnly:isEmbroideryOnly, orderMethod:orderMethod,
  minQty:minQty, priceBreaks:priceBreaks, unitPrice:unitPrice, sizeUpchargePer:sizeUpchargePer,
  upchargeTotal:upchargeTotal, lineTotal:lineTotal, isExtendedSize:isExtendedSize,
  hemRate:getHem, turnaroundDays:turnaroundDays, methodLabel:methodLabel,
  PROMO_CODES:PROMO_CODES, RUSH_MULT:RUSH_MULT, ADDON:{neck:ADDON_NECK,bag:ADDON_BAG},
  MAX_INK:8
};
})(typeof window!=='undefined'?window:globalThis);

(function(){
  var W=window, D=document;
  var api={slice:null, subscribe:sub, refresh:schedule, embedded:false};
  W.AliveViewport=api;
  var subs=[];
  function sub(fn){ if(typeof fn==='function'){subs.push(fn); if(api.slice)fn(api.slice);} }
  function emit(){ for(var i=0;i<subs.length;i++){ try{subs[i](api.slice);}catch(e){} } }

  // Parent-pushed override (backwards compatible with the older embed snippet).
  W.addEventListener('message',function(e){
    var d=e&&e.data;
    if(!d||typeof d!=='object'||d.type!=='alive-viewport')return;
    var t=parseFloat(d.visTop), b=parseFloat(d.visBottom);
    if(isNaN(t)||isNaN(b)||b<=t)return;
    _parentPushed=true;
    api.embedded=true;
    D.documentElement.classList.add('proj-embedded');
    api.slice={visTop:t, visBottom:b};
    emit();
  },false);
  var _parentPushed=false;

  if(W.self===W.top)return;              // not embedded: fixed positioning works
  if(!W.IntersectionObserver)return;     // no way to measure: callers fall back

  api.embedded=true;
  D.documentElement.classList.add('proj-embedded');

  var body=D.body;
  if(!body){ D.addEventListener('DOMContentLoaded',start); } else { start(); }

  var ladderHost, measureEl, ladderIO, rungs=0, RUNG=120, pending=false;

  function docH(){ return Math.max(body.scrollHeight, body.offsetHeight, 1); }

  function start(){
    body=D.body;
    // The ladder and the measuring strip are 1px wide, out of flow and behind
    // everything. They must never affect layout — in particular they must never
    // change body.scrollHeight, which the iframe auto-resize broadcast measures.
    ladderHost=D.createElement('div');
    ladderHost.setAttribute('aria-hidden','true');
    ladderHost.style.cssText='position:absolute;top:0;left:0;width:1px;height:0;pointer-events:none;visibility:hidden;z-index:-1;';
    body.appendChild(ladderHost);

    measureEl=D.createElement('div');
    measureEl.setAttribute('aria-hidden','true');
    // Overshoots UPWARDS only. Overflow above the origin is not scrollable, so
    // this cannot change body.scrollHeight — which matters, because the iframe
    // auto-resize broadcast measures exactly that, and inflating it would start
    // the runaway height-feedback loop. Overshooting DOWNWARDS would do that.
    measureEl.style.cssText='position:absolute;top:-2000px;left:0;width:1px;pointer-events:none;visibility:hidden;z-index:-1;';
    body.appendChild(measureEl);

    ladderIO=new IntersectionObserver(schedule,{threshold:0});
    build();
    if(W.ResizeObserver){ new ResizeObserver(function(){build();schedule();}).observe(body); }
    else { setInterval(function(){build();schedule();},600); }
    W.addEventListener('resize',schedule);
    W.addEventListener('load',function(){build();schedule();});
    schedule();
  }

  function build(){
    if(!ladderHost)return;
    var h=docH();
    measureEl.style.height=(h+2000)+'px';
    var need=Math.max(1,Math.ceil(h/RUNG));
    if(need===rungs)return;
    while(rungs>need){ var last=ladderHost.lastChild; if(!last)break; ladderIO.unobserve(last); ladderHost.removeChild(last); rungs--; }
    for(var i=rungs;i<need;i++){
      var d=D.createElement('div');
      d.style.cssText='position:absolute;left:0;width:1px;height:'+RUNG+'px;top:'+(i*RUNG)+'px;';
      ladderHost.appendChild(d);
      ladderIO.observe(d);
    }
    rungs=need;
  }

  function schedule(){
    if(_parentPushed||pending)return;
    pending=true;
    W.requestAnimationFrame(function(){ pending=false; remeasure(); });
  }

  function remeasure(){
    if(!measureEl)return;
    var io=new IntersectionObserver(function(entries){
      io.disconnect();
      var r=entries[0]&&entries[0].intersectionRect;
      var next=null;
      if(r&&r.height>0){
        var sy=W.pageYOffset||D.documentElement.scrollTop||0;

      }

      if(!a&&!next)return;

      emit();

    io.observe(measureEl);
  }
})();

function missingArtwork(){
  var out = [];
  S.items.forEach(function(it){ (it.artworkFiles || []).forEach(function(f, i){ if(f && f.pending && !f.url) out.push({id:it.id, idx:i, item:it.productName || it.style, location:f.location || 'artwork', name:f.name || ''}); }); });
  return out;
}
function orderRef(){
  var r = null; try{ r = sessionStorage.getItem('alive_order_ref'); }catch(e){}
  if(!r){ r = 'AP-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2,6).toUpperCase(); try{ sessionStorage.setItem('alive_order_ref', r); }catch(e){} }
  return r;
}
function missBlock(){
  var miss = missingArtwork(); if(!miss.length) return '';
  return '<div class="card miss"><div class="hd"><h2>Add your artwork ' + (miss.length === 1 ? 'file' : 'files') + ' again</h2></div>' +
    '<p>Your design didn’t finish uploading. Add it again here — it only takes a moment.</p>' +
    '<div class="reups">' + miss.map(function(m){ var key = m.id + '|' + m.idx, busy = S.reup[key] === 'busy';
      return '<div class="reup"><div><b>' + esc(m.location) + '</b>' + (m.name ? '<span>' + esc(m.name) + '</span>' : '') +
        (S.reup[key] && S.reup[key] !== 'busy' ? '<em>' + esc(S.reup[key]) + '</em>' : '') + '</div>' +
        '<button type="button" class="reup-btn" data-reup="' + esc(key) + '"' + (busy ? ' disabled' : '') + '>' + (busy ? 'Uploading…' : 'Upload file') + '</button></div>';
    }).join('') + '</div>' +
    '<p class="or">Can’t upload it? Email it to <a href="mailto:' + CONFIG.email + '?subject=' + encodeURIComponent('Artwork for order ' + orderRef()) + '">' + CONFIG.email + '</a> and quote <b>' + esc(orderRef()) + '</b>.</p>' +
    '<label class="ack"><input type="checkbox" id="miss-ack"' + (S.missAck ? ' checked' : '') + '> I’ll email my artwork with that reference.</label></div>';
}
function render(){
  if(S.done){ renderDone(); return; }
  if(!S.items.length){
    root.innerHTML = stepper() + '<div class="empty"><h1 style="font-size:22px;font-weight:800;text-transform:uppercase">Your cart is empty</h1>' +
      '<a class="cta" style="max-width:280px;margin:22px auto 0" href="#" data-products="1">Browse products</a></div>';
    wire(); broadcast(); return;
  }
  var t = totals(), pickup = S.ship === 'pickup', promo = CART.getPromo();
  var items = S.items.map(itemHtml).join('');
  var summary =
    '<div class="card sorder"><div class="hd"><h2>Your order</h2></div>' + items +
      '<button class="addmore" type="button" data-products="1">+ Add another product</button></div>' +
    '<div class="card tot">' +
      '<div class="row"><span>' + t.pieces + ' pieces</span><b class="num">' + money(t.base) + '</b></div>' +
      (t.addons ? '<div class="row"><span>Finishing add-ons</span><b class="num">' + money(t.addons) + '</b></div>' : '') +
      (t.rush ? '<div class="row"><span>' + (S.rush === 'rush' ? '7-day rush (+15%)' : '5-day rush (+25%)') + '</span><b class="num">' + money(t.rush) + '</b></div>' : '') +
      (promo && promo.code ? '<div class="row promo"><span>Promo ' + esc(promo.code) + ' <button type="button" class="linkbtn" data-clearpromo="1">remove</button></span><b class="num">applied</b></div>' : '') +
      '<div class="row"><span>' + (pickup ? 'Pickup' : 'Shipping') + tip('shipping') + '</span><b class="num">' + (pickup ? 'Free' : 'Billed separately') + '</b></div>' +
      '<div class="row"><span>Sales tax' + tip('tax') + '</span><b class="num">At payment</b></div>' +
      '<div class="row big"><span>Total</span><span class="v num">' + money(t.total) + '</span></div>' +
      (promo && promo.code ? '' : (S.promoOpen
        ? '<div class="promo-in"><input id="co-promo" placeholder="Promo code" autocomplete="off"><button type="button" class="dbtn" data-applypromo="1">Apply</button></div>' + (S.promoErr ? '<div class="perr">' + esc(S.promoErr) + '</div>' : '')
        : '<button type="button" class="linkbtn promo-link" data-openpromo="1">Have a promo code?</button>')) +
      (S.err ? '<div class="warn">' + S.err + '</div>' : '') +
      '<button class="cta submit-d" type="button" data-submit="1"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Starting secure checkout…' : 'Pay &amp; place order') + '</button>' +
      '<div class="paynote">Secure payment by Stripe · proof before we print' + tip('payment') + '</div>' +
    '</div>';

  root.innerHTML = stepper() +
    '<div class="wrap"><div class="co">' +
      '<div>' +
        '<div class="hd"><h1>Checkout</h1></div>' +
        /* Phones: the order sits open at the top (the side column's copy is hidden there). */
        '<div class="card morder"><div class="hd mo-hd"><h2>Your order</h2><b class="num">' + money(t.total) + '</b></div>' + items +
          '<button class="addmore" type="button" data-products="1">+ Add another product</button></div>' +
        missBlock() +
        '<div class="card"><div class="hd"><h2>Your details</h2></div>' +
          '<div class="fields two">' + field('name','Full name','text','name') + field('email','Email','email','email') + '</div>' +
          '<div class="fields two" style="margin-top:14px">' + field('phone','Phone','tel','tel') + field('company','Company <span>(optional)</span>','text','organization') + '</div></div>' +
        '<div class="card"><div class="hd"><h2 class="h2t">Delivery' + tip('shipping') + '</h2></div><div class="ships">' +
          shipRow('ship', 'Ship it to me', 'Shipping billed separately once packed', 'Quoted') +
          shipRow('pickup', 'Pick up in store', esc(CONFIG.address), 'Free') + '</div>' +
          (pickup ? '' :
          '<div class="fields" style="margin-top:14px">' + field('addr1','Street address','text','address-line1') + '</div>' +
          '<div class="fields" style="margin-top:14px">' + field('addr2','Apt, suite, floor <span>(optional)</span>','text','address-line2') + '</div>' +
          '<div class="fields two" style="margin-top:14px">' + field('city','City','text','address-level2') + field('state','State','text','address-level1') + '</div>' +
          '<div class="fields" style="margin-top:14px;max-width:200px">' + field('zip','ZIP code','text','postal-code',' inputmode="numeric"') + '</div>') +
        '</div>' +
        (ADDONS.some(function(a){ return addonPieces(a) > 0; })
          ? '<div class="card"><div class="hd"><h2>Finish it properly</h2></div><div class="ships">' + ADDONS.map(addonRow).join('') + '</div></div>' : '') +
        '<div class="card"><div class="hd"><h2 class="h2t">Need it sooner?' + tip('turnaround') + '</h2></div><div class="ships">' +
          rushRow('std', 'Standard — ' + E.turnaroundDays('std', false) + ' business days') + rushRow('rush', '7 business day rush') + rushRow('super', '5 business day rush') +
        '</div></div>' +
        '<div class="card"><div class="hd"><h2>Anything else?</h2></div><div class="fields">' + field('notes','Notes for your order <span>(optional)</span>','textarea','') + '</div></div>' +
        '<div class="guar"><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6L9 17l-5-5"/></svg><span>No setup fees and no screen charges</span></div>' +
          '<div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6L9 17l-5-5"/></svg><span>Proof before we print, every time</span></div>' +
          '<div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6L9 17l-5-5"/></svg><span>100% print guarantee — wrong, we reprint it</span></div></div>' +
        '<div class="card" style="margin-top:18px">' + helpBar() + '</div>' +
      '</div>' +
      '<div class="side">' + summary + '</div>' +
    '</div></div>' +
    '<div class="bar"><div class="bar-in"><div><div class="k">Order total</div><div class="v num">' + money(t.total) + '</div>' +
      '<div class="s num">' + t.pieces + ' pcs · plus tax</div></div>' +
      '<button class="cta" id="co-submit" type="button"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Starting…' : 'Pay &amp; place order') + '</button></div></div>';
  wire(); placeBar(); broadcast();
}
function stepper(){
  var defs = ['Design','Sizes','Checkout'], out = '<div class="steps"><div class="steps-in">';
  defs.forEach(function(l, i){
    var done = i < 2;
    out += '<span class="stp ' + (done ? 'done' : 'now') + '"><span class="dot">' + (done ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><path d="M20 6L9 17l-5-5"/></svg>' : 3) + '</span><span class="nm">' + l + '</span></span>';
    if(i < 2) out += '<span class="rule done"></span>';
  });
  return out + '</div></div>';
}
function helpBar(){
  return '<div class="help"><div class="cap">Need a hand?</div>' +
    '<a href="' + CONFIG.phoneHref + '"><span>Call <b>' + esc(CONFIG.phone) + '</b></span></a>' +
    '<a href="mailto:' + esc(CONFIG.email) + '"><span>Email <b>' + esc(CONFIG.email) + '</b></span></a>' +
    '<p>Real people in Las Vegas — Mon–Fri, 8am to 4pm.</p></div>';
}

/* ------------------------------------------------------------ events */
function wire(){
  root.querySelectorAll('[data-f]').forEach(function(el){
    el.oninput = function(){ S.form[el.dataset.f] = el.value;
      if(S.bad[el.dataset.f]){ delete S.bad[el.dataset.f]; var w = root.querySelector('[data-wrap="' + el.dataset.f + '"]'); if(w) w.classList.remove('bad'); } };
  });
  root.querySelectorAll('[data-ship]').forEach(function(b){ b.onclick = function(){ S.ship = b.dataset.ship; render(); }; });
  root.querySelectorAll('[data-rush]').forEach(function(b){ b.onclick = function(){ S.rush = b.dataset.rush; applyOptions(); render(); }; });
  root.querySelectorAll('[data-addon]').forEach(function(b){
    b.onclick = function(e){ if(e.target.closest('[data-ex]')) return; S.addon[b.dataset.addon] = !S.addon[b.dataset.addon]; applyOptions(); render(); };
    b.onkeydown = function(e){ if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); b.click(); } };
  });
  root.querySelectorAll('[data-ex]').forEach(function(x){
    x.onclick = function(e){ e.stopPropagation(); var a = null; ADDONS.forEach(function(z){ if(z.key === x.dataset.ex) a = z; });
      openBox('<figure><img src="' + CONFIG.addonImg[x.dataset.ex] + '" alt=""><figcaption><span>' + esc(a ? a.label : '') + '</span><button type="button" class="x">Close</button></figcaption></figure>', 'lbox'); };
  });
  root.querySelectorAll('[data-rm]').forEach(function(b){ b.onclick = function(){ CART.removeItem(b.dataset.rm); S.items = CART.getItems(); render(); }; });
  root.querySelectorAll('[data-products]').forEach(function(b){ b.onclick = function(e){ e.preventDefault(); nav(CONFIG.pages[FLOW].products); }; });
  var op = root.querySelector('[data-openpromo]'); if(op) op.onclick = function(){ S.promoOpen = true; render(); var i = document.getElementById('co-promo'); if(i) i.focus(); };
  var ap = root.querySelector('[data-applypromo]');
  if(ap) ap.onclick = function(){
    var code = String((document.getElementById('co-promo') || {}).value || '').trim().toUpperCase();
    if(!E.PROMO_CODES[code]){ S.promoErr = 'That code isn’t valid.'; render(); return; }
    CART.setPromo({code:code, discount:E.PROMO_CODES[code]}); S.promoErr = ''; applyOptions(); render();
  };
  var cp = root.querySelector('[data-clearpromo]'); if(cp) cp.onclick = function(){ CART.setPromo(null); applyOptions(); render(); };
  var ack = document.getElementById('miss-ack'); if(ack) ack.onchange = function(){ S.missAck = ack.checked; };
  root.querySelectorAll('[data-readd]').forEach(function(a){ a.onclick = function(e){ e.preventDefault(); nav(a.getAttribute('href')); }; });
  root.querySelectorAll('[data-reup]').forEach(function(b){ b.onclick = function(){ reupload(b.dataset.reup); }; });
  root.querySelectorAll('#co-submit,[data-submit]').forEach(function(b){ b.onclick = submit; });
}

var REQUIRED = {name:'Please tell us your name', email:'We need an email to send your proof to', phone:'A phone number helps us reach you quickly'};
function validate(){
  S.bad = {};
  Object.keys(REQUIRED).forEach(function(k){ if(!String(S.form[k]||'').trim()) S.bad[k] = REQUIRED[k]; });
  if(S.form.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.form.email.trim())) S.bad.email = 'That email does not look right';
  if(S.ship !== 'pickup'){
    if(!String(S.form.addr1||'').trim()) S.bad.addr1 = 'Where are we shipping to?';
    if(!String(S.form.city||'').trim()) S.bad.city = 'City is needed';
    if(!String(S.form.state||'').trim()) S.bad.state = 'State is needed';
    if(!/^\d{5}$/.test(String(S.form.zip||'').trim())) S.bad.zip = 'A 5-digit ZIP, please';
  }
  return Object.keys(S.bad).length === 0;
}
function shippingText(){
  if(S.ship === 'pickup') return 'PICKUP at ' + CONFIG.address;
  var f = S.form;
  return [f.addr1, f.addr2, f.city + ', ' + f.state + ' ' + f.zip].filter(function(x){ return String(x||'').trim(); }).join(', ');
}
/* Same fields cart.html sends, so the GoHighLevel workflow mapping keeps working. */
function buildPayload(){
  var items = S.items, promo = CART.getPromo(), miss = missingArtwork(), f = S.form;
  var parts = String(f.name||'').trim().split(/\s+/), firstName = parts[0] || '', lastName = parts.slice(1).join(' ');
  var subtotal = +items.reduce(function(s, it){ return s + (+it.lineTotal || 0); }, 0).toFixed(2);
  var savings = +items.reduce(function(s, it){ return s + (+it.promoSavingsTotal || 0); }, 0).toFixed(2);
  var pieces = items.reduce(function(s, it){ return s + (it.qty|0); }, 0);
  function sizesOf(it){ return it.sizes ? Object.keys(it.sizes).map(function(k){ return k + ':' + it.sizes[k]; }).join(', ') : ''; }
  var itemsText = items.map(function(it, i){
    return '#' + (i+1) + ' ' + it.brand + ' ' + it.style + ' ' + it.productName + ' (' + it.color + ') — ' + it.qty + ' pcs (' + sizesOf(it) + ') — ' + it.decoLabel + ' on ' + (it.locations || []).join(', ') +
      (it.decoMethod === 'sp' ? ' [Front ' + (it.frontColors || 1) + 'c, Back ' + (it.backColors || 1) + 'c]' : '') +
      (it.addonList && it.addonList.length ? ' — Addons: ' + it.addonList.join(', ') : '') + ' — ' + it.turnaroundLabel +
      ' — Unit $' + (+it.unitPrice).toFixed(2) + ', Line $' + (+it.lineTotal).toFixed(2) + (it.artworkLink ? ' — Artwork: ' + it.artworkLink : '') + (it.notes ? ' — Notes: ' + it.notes : '');
  }).join('\n');
  var itemsBlock = items.map(function(it, i){
    var L = ['Item #' + (i+1) + ': ' + it.brand + ' ' + it.style + ' ' + it.productName + ' (' + it.color + ')',
      '  Qty: ' + it.qty + ' pcs (' + sizesOf(it) + ')',
      '  Decoration: ' + it.decoLabel + (it.decoMethod === 'sp' ? ' [Front ' + (it.frontColors || 1) + 'c, Back ' + (it.backColors || 1) + 'c]' : ''),
      '  Locations: ' + ((it.locations || []).join(', ') || '—')];
    if(it.addonList && it.addonList.length) L.push('  Add-ons: ' + it.addonList.join(', '));
    L.push('  Turnaround: ' + it.turnaroundLabel);
    L.push('  Price: $' + (+it.unitPrice).toFixed(2) + '/unit, $' + (+it.lineTotal).toFixed(2) + ' line total');
    if(it.promoCodeAtAdd) L.push('  Promo: ' + it.promoCodeAtAdd);
    if(it.artworkLater) L.push('  *** ARTWORK TO FOLLOW — customer will email it ***');
    var up = (it.artworkFiles || []).filter(function(x){ return x && x.url; });
    if(up.length) L.push('  Artwork files: ' + up.map(function(x){ return (x.location ? x.location + ': ' : '') + x.url; }).join(' | '));
    var pend = (it.artworkFiles || []).filter(function(x){ return x && x.pending && !x.url; });
    if(pend.length) L.push('  *** ARTWORK NOT RECEIVED: ' + pend.map(function(x){ return x.location || 'artwork'; }).join(', ') + ' ***');
    if(it.notes) L.push('  Notes: ' + it.notes);
    return L.join('\n');
  }).join('\n\n');
  var allArt = []; items.forEach(function(it){ (it.artworkFiles || []).forEach(function(x){ if(x && x.url) allArt.push(x.url); }); });
  var artworkHtml = items.map(function(it){ return (it.artworkFiles || []).filter(function(x){ return x.url; }).map(function(x){
    return /\.(png|jpe?g|gif|webp)$/i.test(x.name || '') ? '<a href="' + x.url + '" target="_blank"><img src="' + x.url + '" alt="' + esc(x.name) + '" style="max-width:280px;max-height:280px;margin:6px;border:1px solid #ddd;border-radius:6px;"></a>'
      : '<div style="margin:6px;">&#128206; <a href="' + x.url + '" target="_blank">' + esc(x.name || 'artwork') + '</a></div>'; }).join(''); }).join('');
  var submittedAt = new Date().toISOString();
  var noteText = (miss.length ? '⚠️ ARTWORK MISSING — DO NOT SCHEDULE FOR PRINT\nReference ' + orderRef() + '\nMissing: ' + miss.map(function(m){ return m.location; }).join(', ') + '\n--------------------------------------------\n\n' : '') +
    '🛍 NEW ORDER\nSubmitted: ' + submittedAt + '\nSource: New checkout (product page v3)\n\n' +
    '— CUSTOMER —\nName: ' + (firstName + ' ' + lastName).trim() + '\nCompany: ' + (f.company || '—') + '\nEmail: ' + (f.email || '—') + '\nPhone: ' + (f.phone || '—') + '\nDelivery: ' + shippingText() + '\n\n' +
    '— ORDER (' + items.length + ' ' + (items.length === 1 ? 'item' : 'items') + ', ' + pieces + ' pcs) —\n' + itemsBlock + '\n\n' +
    '— ARTWORK FILES (' + allArt.length + ') —\n' + (allArt.length ? allArt.join('\n') : 'None uploaded') + '\n\n' +
    '— PRICING —\nSubtotal: $' + (subtotal + savings).toFixed(2) + '\n' + (savings > 0 ? 'Promo ' + (promo ? promo.code : '') + ': -$' + savings.toFixed(2) + '\n' : '') +
    'Total (before tax): $' + subtotal.toFixed(2) + '\nShipping: ' + (S.ship === 'pickup' ? 'Pickup (free)' : 'Bill separately') + '\n\n— CUSTOMER NOTES —\n' + (f.notes || '—');
  return {
    firstName:firstName, lastName:lastName, email:f.email, phone:f.phone, company:f.company,
    shippingAddress:shippingText(), orderNotes:f.notes, itemCount:items.length, pieceCount:pieces,
    cartSubtotal:'$' + (subtotal + savings).toFixed(2), cartTotal:'$' + subtotal.toFixed(2), cartTotalValue:subtotal,
    totalPrice:'$' + subtotal.toFixed(2), totalPriceValue:subtotal,
    promoCode:promo ? promo.code : '', promoSavings:'$' + savings.toFixed(2), promoSavingsValue:savings,
    items:JSON.stringify(items.map(function(it){ var c = Object.assign({}, it); delete c.pricingProduct; return c; })),
    itemsSummary:itemsText, itemsBlock:itemsBlock, artworkLinks:allArt.join('\n'), mockupLinks:'', mockupCount:0,
    artworkHtml:artworkHtml, noteText:noteText, source:'New checkout (product page v3)', submittedAt:submittedAt
  };
}
function submit(){
  S.err = '';
  if(!validate()){ render(); var first = root.querySelector('.f.bad input, .f.bad textarea'); if(first){ first.focus(); scrollToEl(first); } return; }
  if(staleItems().length){ S.err = 'One item in your cart has an old price. Remove it and add it again, then place your order.'; render(); scrollToEl(root.querySelector('.stale')); return; }
  if(missingArtwork().length && !S.missAck){ S.err = 'Please confirm you’ll email the artwork we’re missing.'; render(); scrollToEl(root.querySelector('.miss')); return; }
  applyOptions();
  var ref = orderRef(), payload = buildPayload();
  var fd = new FormData();
  Object.keys(payload).forEach(function(k){ var v = payload[k]; fd.append(k, v == null ? '' : (typeof v === 'object' ? JSON.stringify(v) : String(v))); });
  fd.append('paymentStatus', 'awaiting_payment'); fd.append('orderRef', ref);
  /* Queued by the browser, so it survives the redirect to payment. */
  var sent = false;
  try{ if(navigator.sendBeacon) sent = navigator.sendBeacon(CONFIG.ghlWebhook, fd); }catch(e){}
  if(!sent){ try{ fetch(CONFIG.ghlWebhook, {method:'POST', body:fd, keepalive:true}).catch(function(){}); }catch(e){} }
  S.busy = true; render();
  var f = S.form;
  var body = {items:S.items, total:totals().total, orderRef:ref,
    customer:{name:f.name, email:f.email, phone:f.phone, company:f.company}};
  fetch(CONFIG.payEndpoint.replace(/\/$/,'') + '/create-session', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
    .then(function(res){
      if(res.ok && res.j && res.j.url){ nav(res.j.url); return; }
      S.busy = false; S.err = esc((res.j && res.j.error) || 'We couldn’t start payment. Please try again.'); render();
    })
    .catch(function(){ S.busy = false;
      S.err = 'We couldn’t reach our payment service. Your order details reached us — <a href="' + CONFIG.phoneHref + '">call ' + CONFIG.phone + '</a> and we’ll finish it by phone.'; render(); });
}

/* ------------------------------------------------------------ return from Stripe */
function renderDone(){
  var d = S.done;
  root.innerHTML = stepper() + '<div class="thanks"><div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M20 6L9 17l-5-5"/></svg></div>' +
    '<h1>Payment received</h1><p>Thank you — your order is in and a receipt is on its way to your inbox.</p>' +
    '<div class="next"><h3>What happens next</h3><ol>' +
      '<li>We check your artwork and email you a proof.</li><li>You approve the proof. Nothing prints until you do.</li>' +
      '<li>We print, check every piece, and ship it or call you for pickup.</li></ol></div>' +
    '<a class="cta" style="max-width:300px;margin:26px auto 0" href="#" data-products="1">Start another order</a></div>';
  wire(); scrollToEl(root.querySelector('.steps')); broadcast();
}
(function boot(){
  if(qp('paid')){
    try{ localStorage.removeItem(CART.K_ITEMS); localStorage.removeItem(CART.K_PROMO); sessionStorage.removeItem('alive_order_ref'); }catch(e){}
    S.items = []; S.done = {paid:qp('paid')}; render(); return;
  }
  if(qp('canceled')) S.err = 'Payment was cancelled — your order is still here whenever you’re ready.';
  applyOptions();
  render();
})();
window.__ALIVE_CHECKOUT__ = {S:S, render:render, totals:totals, buildPayload:buildPayload};
})();

</script>
</body>
</html>
